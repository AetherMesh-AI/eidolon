name: "🐛 Bug Report"
description: Report a bug — something that's broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it quickly.

        **Before submitting**, please:
        - [ ] Search [existing issues](https://github.com/AetherMesh-AI/Eidolon/issues) to avoid duplicates
        - [ ] Check [Eidolon releases](https://github.com/AetherMesh-AI/Eidolon/releases) for build-specific instructions and known limitations
        - [ ] Review any diagnostic excerpts before posting; omit private conversations, credentials, and personal data

        For possible vulnerabilities, follow the [security policy](https://github.com/AetherMesh-AI/Eidolon/blob/main/SECURITY.md) instead of posting sensitive details here.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what's broken. Include error messages, tracebacks, or screenshots if relevant.
      placeholder: |
        What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug. The more specific, the faster we can fix it.
      placeholder: |
        1. Open Eidolon and select the affected agent or view
        2. Perform the action "..."
        3. Observe the result
        4. Error appears: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include relevant, sanitized error output if available.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Eidolon is affected?
      multiple: true
      options:
        - Desktop / agent management
        - CLI (interactive chat)
        - Gateway (Telegram/Discord/Slack/WhatsApp)
        - Setup / Installation
        - Tools (terminal, file ops, web, code execution, etc.)
        - Skills (skill loading, skill hub, skill guard)
        - Agent Core (conversation loop, context compression, memory)
        - Configuration (config.yaml, .env, hermes setup)
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Messaging Platform (if gateway-related)
      description: Which platform adapter is affected?
      multiple: true
      options:
        - N/A (not gateway-related)
        - Telegram
        - Discord
        - Slack
        - WhatsApp

  - type: textarea
    id: debug-report
    attributes:
      label: Sanitized Diagnostics (optional)
      description: |
        If useful, run `hermes debug share --local` against the affected Eidolon runtime to inspect diagnostics locally.
        Review the output and include only the minimum relevant, sanitized excerpts.
        Do not post full logs, private conversations, credentials, raw environment dumps, or sensitive file paths.
        No diagnostics upload is required to file an Eidolon issue.
      placeholder: |
        Relevant error message, with private details removed...
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 24.04, macOS 15.2, Windows 11
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.11.9"

  - type: input
    id: hermes-version
    attributes:
      label: Eidolon Build / Source Revision
      description: Version shown in About, release tag, or checkout commit; mention local changes.
      placeholder: "App version, release tag, or commit SHA"

  - type: textarea
    id: logs
    attributes:
      label: Additional Logs / Traceback (optional)
      description: |
        Include relevant sanitized error output, tracebacks, or screenshots.
        Remove private conversations, credentials, and personal data before posting.
      render: shell

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause Analysis (optional)
      description: |
        If you've dug into the code and identified the root cause, share it here.
        Include file paths, line numbers, and code snippets if possible. This massively speeds up fixes.
      placeholder: |
        The bug is in `gateway/run.py` line 949. `len(history)` counts session_meta entries
        but `agent_messages` was built from filtered history...

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix (optional)
      description: If you have a fix in mind (or a PR ready), describe it here.
      placeholder: |
        Replace `.get()` with `.pop()` on line 289 of `gateway/platforms/base.py`
        to actually clear the pending message after retrieval.

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - label: I'd like to fix this myself and submit a PR
