name: "🔧 Setup / Installation Help"
description: Having trouble installing or configuring Eidolon? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you're having trouble! Please fill out the details below so we can help.

        **Quick checks first:**
        - Check the [Eidolon overview](https://github.com/AetherMesh-AI/Eidolon/blob/main/README.md#trying-eidolon) and [releases](https://github.com/AetherMesh-AI/Eidolon/releases) for build-specific instructions and limitations
        - Confirm which checkout, installed build, and application home you are using before running installation or update commands
        - Include the exact steps and relevant sanitized errors below; no diagnostics upload is required

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
        I ran `hermes setup` and selected Nous Portal, but when I try to
        start the gateway I get...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. Ran the install script: `curl -fsSL ... | bash`
        2. Ran `hermes setup` and chose "Quick setup"
        3. Selected OpenRouter, entered API key
        4. Ran `hermes chat` and got error...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - Install script (curl | bash)
        - Manual clone + pip/uv install
        - PowerShell installer (Windows)
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version` (or `python3 --version`)
      placeholder: "3.11.9"

  - type: input
    id: hermes-version
    attributes:
      label: Eidolon Build / Source Revision
      description: Version shown in About, release tag, or checkout commit, if available; mention local changes.
      placeholder: "App version, release tag, or commit SHA"

  - type: textarea
    id: debug-report
    attributes:
      label: Sanitized Diagnostics (optional)
      description: |
        If the runtime is usable, inspect diagnostics locally with `hermes debug share --local` against the affected Eidolon installation.
        Review the output and include only minimum relevant, sanitized excerpts.
        Do not post full logs, private conversations, credentials, raw environment dumps, or sensitive file paths.
        For possible vulnerabilities, follow the repository's SECURITY.md before sharing details.
      placeholder: |
        Relevant error message, with private details removed...
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Sanitized Error Output
      description: Paste the relevant error message or traceback after removing private information. This will be auto-formatted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Checked the release instructions for my build
        - Restarted the affected Eidolon installation
        - Checked that the selected provider is configured, without sharing any credentials
