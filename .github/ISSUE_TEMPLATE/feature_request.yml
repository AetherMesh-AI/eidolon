name: "✨ Feature Request"
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting, please consider:

        - Read [Eidolon's direction](https://github.com/AetherMesh-AI/Eidolon/blob/main/README.md) and [engineering conventions](https://github.com/AetherMesh-AI/Eidolon/blob/main/CONTRIBUTING.md#engineering-conventions). Prefer existing extension boundaries for specialized integrations.
        - **Search [existing issues](https://github.com/AetherMesh-AI/Eidolon/issues)** — someone may have already proposed this.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? What are you trying to do that you can't today?
      placeholder: |
        I'm trying to use Eidolon with [provider/platform/workflow] but currently
        there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as specific as you can — CLI flags, config options, UI behavior.
      placeholder: |
        Add a `--foo` flag to `hermes chat` that enables...
        Or: Add a config key `bar.baz` that controls...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is the proposed solution better?

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - Desktop / agent management
        - New tool
        - New bundled skill
        - CLI improvement
        - Gateway / messaging improvement
        - Configuration option
        - Performance / reliability
        - Developer experience (tests, docs, CI)
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big is this change?
      options:
        - Small (single file, < 50 lines)
        - Medium (few files, < 300 lines)
        - Large (new module or significant refactor)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself and submit a PR

  - type: textarea
    id: debug-report
    attributes:
      label: Sanitized Diagnostics (optional)
      description: |
        If relevant, inspect diagnostics locally with `hermes debug share --local` against the affected Eidolon runtime.
        Include only reviewed, sanitized excerpts. Do not post full logs, private conversations, credentials, or personal data.
        No diagnostics upload is required.
      placeholder: |
        Relevant error message, with private details removed...
      render: shell
