name: Subscription readonly store native proof
'on':
  push:
    branches:
    - proof/subscription-readonly-store-20261020
permissions:
  contents: read
concurrency:
  group: subscription-readonly-store-native-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
jobs:
  readonly-native-contracts:
    name: Readonly store native proof (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          python: '3.11'
          platform: darwin
        - os: windows-latest
          python: '3.11'
          platform: win32
        - os: windows-latest
          python: '3.12'
          platform: win32
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      SUBSCRIPTION_PROOF_SHA: 8bb3444382fe658e937830441b5e6195907c731b
      SUBSCRIPTION_PROOF_TREE: 01aec73a193becd7c74f242cf97a3a816e190ba6
      SUBSCRIPTION_WORKFLOW_EVENT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      READONLY_PROOF_PARENT: 0babe54215cd06220b2ee528627bfd993ed1cf1a
      READONLY_STORE_SHA256: 9c69661ccade2af564a0c84ad50f791b2384d4f90f0bc6b296b3c0a88f8efd2a
      READONLY_HARNESS_SHA256: d69027780c7549090ee7c601a391d9c009a0cb75e1cba1823780effb050b42dc
      PROOF_PYTHON: ${{ matrix.python }}
      PROOF_PLATFORM: ${{ matrix.platform }}
      UV_PYTHON_DOWNLOADS: never
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 8bb3444382fe658e937830441b5e6195907c731b
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout immutable proof harness only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: proof-harness
        fetch-depth: 2
        persist-credentials: false
        sparse-checkout: .github/proofs
        sparse-checkout-cone-mode: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - name: Install locked native Python dependencies
      run: |
        set -euo pipefail
        python -m pip install uv==0.12.23
        uv sync --locked --python "$(python -c 'import sys; sys.stdout.write(sys.executable)')" --extra dev
        uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
        if test "$RUNNER_OS" = Windows; then py="$PWD/.venv/Scripts/python.exe"; else py="$PWD/.venv/bin/python"; fi
        printf 'HERMES_PYTHON=%s\n' "$py" >> "$GITHUB_ENV"
        printf 'READONLY_HARNESS=%s/.github/proofs/readonly-store\n' "$(cd ../proof-harness && pwd)" >> "$GITHUB_ENV"
        printf 'READONLY_WORKFLOW=%s/.github/proofs/readonly-workflow\n' "$(cd ../proof-harness && pwd)" >> "$GITHUB_ENV"
    - name: Verify exact source, harness and installed native interpreter
      run: |
        set -euo pipefail
        mkdir -p readonly-native-proof
        test "$(git -C ../proof-harness rev-parse HEAD)" = "$SUBSCRIPTION_WORKFLOW_EVENT_SHA"
        test "$(git -C ../proof-harness show -s --format=%P HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
        git -C ../proof-harness rev-parse HEAD 'HEAD^{tree}' > readonly-native-proof/harness-source.txt
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" preflight --source "$PWD" --head "$SUBSCRIPTION_PROOF_SHA" --tree "$SUBSCRIPTION_PROOF_TREE" --parent "$READONLY_PROOF_PARENT" --store-sha256 "$READONLY_STORE_SHA256" --harness "$READONLY_HARNESS" --harness-sha256 "$READONLY_HARNESS_SHA256" --collection "$READONLY_WORKFLOW/readonly-collection.json" --platform "$PROOF_PLATFORM" --python "$PROOF_PYTHON" --output readonly-native-proof/preflight.json
    - name: Collect and execute exact readonly source contracts once
      run: |
        set -euo pipefail
        mkdir -p readonly-native-proof/collection-home
        HERMES_HOME="$PWD/readonly-native-proof/collection-home" "$HERMES_PYTHON" -B -m pytest tests/eidolon_cli/test_organization_store_readonly_connections.py --collect-only -q -p no:cacheprovider 2>&1 | tee readonly-native-proof/contracts-collection.log
        scripts/run_tests.sh tests/eidolon_cli/test_organization_store_readonly_connections.py --file-retries 0 --junitxml="$PWD/readonly-native-proof/contracts-junit.xml" 2>&1 | tee readonly-native-proof/contracts.log
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" contracts --collection "$READONLY_WORKFLOW/readonly-collection.json" --platform "$PROOF_PLATFORM" --junit readonly-native-proof/contracts-junit.xml --collect-log readonly-native-proof/contracts-collection.log --output readonly-native-proof/contracts-gate.json
    - name: Prove writable contention and readonly refusal with the loaded SQLite
      run: |
        set -euo pipefail
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/run.py" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --output "$PWD/readonly-native-proof/mechanism" --suite all
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/verify_evidence.py" --evidence "$PWD/readonly-native-proof/mechanism" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --suite all
    - name: Retain native source, runtime, VFS, ACL and exact case evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: subscription-readonly-native-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: source/readonly-native-proof/
        retention-days: 7
        if-no-files-found: error
  subscription-native-macos:
    name: Readonly store and nine setup/API journeys (macOS, Python 3.12)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      SUBSCRIPTION_PROOF_SHA: 8bb3444382fe658e937830441b5e6195907c731b
      SUBSCRIPTION_PROOF_TREE: 01aec73a193becd7c74f242cf97a3a816e190ba6
      SUBSCRIPTION_WORKFLOW_EVENT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      READONLY_PROOF_PARENT: 0babe54215cd06220b2ee528627bfd993ed1cf1a
      READONLY_STORE_SHA256: 9c69661ccade2af564a0c84ad50f791b2384d4f90f0bc6b296b3c0a88f8efd2a
      READONLY_HARNESS_SHA256: d69027780c7549090ee7c601a391d9c009a0cb75e1cba1823780effb050b42dc
      PROOF_PYTHON: '3.12'
      PROOF_PLATFORM: darwin
      UV_PYTHON_DOWNLOADS: never
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 8bb3444382fe658e937830441b5e6195907c731b
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout immutable proof harness only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: proof-harness
        fetch-depth: 2
        persist-credentials: false
        sparse-checkout: .github/proofs
        sparse-checkout-cone-mode: true
    - name: Verify immutable candidate source and actual macOS host
      run: |
        set -euo pipefail
        mkdir -p subscription-native-proof
        [[ "$SUBSCRIPTION_PROOF_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$SUBSCRIPTION_PROOF_TREE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SUBSCRIPTION_PROOF_TREE"
        test "$(git show -s --format=%P HEAD)" = "$READONLY_PROOF_PARENT"
        test "$(git write-tree)" = "$SUBSCRIPTION_PROOF_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        test "$(uname -s)" = Darwin
        test -x /usr/bin/sandbox-exec
        git rev-parse HEAD 'HEAD^{tree}' HEAD:apps/desktop/src HEAD:apps/desktop/e2e > subscription-native-proof/source.txt
        git show -s --format=%P HEAD > subscription-native-proof/parents.txt
        printf '%s\n' "$SUBSCRIPTION_WORKFLOW_EVENT_SHA" > subscription-native-proof/workflow-event.txt
        {
          sw_vers
          uname -a
          printf 'ImageOS=%s\nImageVersion=%s\nRunnerOS=%s\nRunnerArch=%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUNNER_OS:-}" "${RUNNER_ARCH:-}"
        } | tee subscription-native-proof/host.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: source/package-lock.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install locked dependencies
      run: |
        set -euo pipefail
        python -m pip install uv==0.12.23
        uv sync --locked --python "$(python -c 'import sys; sys.stdout.write(sys.executable)')" --extra dev
        uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
        npm ci
        node --version > subscription-native-proof/node-version.txt
        .venv/bin/python --version > subscription-native-proof/python-version.txt
        printf 'HERMES_PYTHON=%s/.venv/bin/python\n' "$PWD" >> "$GITHUB_ENV"
        printf 'HERMES_DESKTOP_PYTHON=%s/.venv/bin/python\n' "$PWD" >> "$GITHUB_ENV"
        printf 'READONLY_HARNESS=%s/.github/proofs/readonly-store\n' "$(cd ../proof-harness && pwd)" >> "$GITHUB_ENV"
        printf 'READONLY_WORKFLOW=%s/.github/proofs/readonly-workflow\n' "$(cd ../proof-harness && pwd)" >> "$GITHUB_ENV"
    - name: Verify exact source, harness and installed native interpreter
      run: |
        set -euo pipefail
        mkdir -p readonly-native-proof
        test "$(git -C ../proof-harness rev-parse HEAD)" = "$SUBSCRIPTION_WORKFLOW_EVENT_SHA"
        test "$(git -C ../proof-harness show -s --format=%P HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
        git -C ../proof-harness rev-parse HEAD 'HEAD^{tree}' > readonly-native-proof/harness-source.txt
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" preflight --source "$PWD" --head "$SUBSCRIPTION_PROOF_SHA" --tree "$SUBSCRIPTION_PROOF_TREE" --parent "$READONLY_PROOF_PARENT" --store-sha256 "$READONLY_STORE_SHA256" --harness "$READONLY_HARNESS" --harness-sha256 "$READONLY_HARNESS_SHA256" --collection "$READONLY_WORKFLOW/readonly-collection.json" --platform "$PROOF_PLATFORM" --python "$PROOF_PYTHON" --output readonly-native-proof/preflight.json
    - name: Collect and execute exact readonly source contracts once
      run: |
        set -euo pipefail
        mkdir -p readonly-native-proof/collection-home
        HERMES_HOME="$PWD/readonly-native-proof/collection-home" "$HERMES_PYTHON" -B -m pytest tests/eidolon_cli/test_organization_store_readonly_connections.py --collect-only -q -p no:cacheprovider 2>&1 | tee readonly-native-proof/contracts-collection.log
        scripts/run_tests.sh tests/eidolon_cli/test_organization_store_readonly_connections.py --file-retries 0 --junitxml="$PWD/readonly-native-proof/contracts-junit.xml" 2>&1 | tee readonly-native-proof/contracts.log
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" contracts --collection "$READONLY_WORKFLOW/readonly-collection.json" --platform "$PROOF_PLATFORM" --junit readonly-native-proof/contracts-junit.xml --collect-log readonly-native-proof/contracts-collection.log --output readonly-native-proof/contracts-gate.json
    - name: Prove writable contention and readonly refusal with the loaded SQLite
      run: |
        set -euo pipefail
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/run.py" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --output "$PWD/readonly-native-proof/mechanism" --suite all
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/verify_evidence.py" --evidence "$PWD/readonly-native-proof/mechanism" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --suite all
    - name: Verify focused host migration, RPC and fixture regressions
      run: |
        set -euo pipefail
        scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_setup_subscription_host.py tests/eidolon_cli/test_organization_setup_subscription_auth.py tests/eidolon_cli/test_organization_setup_subscription_recovery.py tests/tui_gateway/test_organization_setup_subscription.py tests/eidolon_cli/test_subscription_native_recovery_faults.py --file-retries 0 -- -vv -o faulthandler_timeout=30 2>&1 | tee subscription-native-proof/migration-backend.log
    - name: Require genuine macOS legacy seed without a skip
      run: |
        set -euo pipefail
        scripts/run_tests.sh tests/eidolon_cli/test_subscription_native_recovery_faults.py -k native_host_migration_seed_is_legacy_without_provider_consent --file-retries 0 --junitxml="$PWD/subscription-native-proof/migration-seed-junit.xml" 2>&1 | tee subscription-native-proof/migration-seed.log
        .venv/bin/python - <<'PYTHON'
        from pathlib import Path
        import xml.etree.ElementTree as ET
        cases = list(ET.parse(Path('subscription-native-proof/migration-seed-junit.xml')).iter('testcase'))
        expected = {
            'test_native_host_migration_seed_is_legacy_without_provider_consent[True]',
            'test_native_host_migration_seed_is_legacy_without_provider_consent[False]',
        }
        assert len(cases) == 2
        assert {case.get('name') for case in cases} == expected
        assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases)
        print('Both genuine macOS legacy seed variants passed once without a skip')
        PYTHON
    - name: Verify migration components and native network observers
      working-directory: source/apps/desktop
      run: |
        set -euo pipefail
        node --test e2e/subscription-native-observer.test.cjs e2e/subscription-native-sandbox.test.cjs e2e/subscription-native-lifecycle.test.cjs 2>&1 | tee ../../subscription-native-proof/observer-tests.log
        npx vitest run --project ui src/app/eidolon/team-setup-subscription-client.test.ts src/app/eidolon/team-setup-subscription.test.tsx src/app/eidolon/team-onboarding-subscription.test.tsx src/app/eidolon/organization-setup-connection-client.test.ts src/app/eidolon/organization-setup-connection.test.tsx 2>&1 | tee ../../subscription-native-proof/components.log
    - name: Verify desktop types
      working-directory: source/apps/desktop
      run: |
        set -euo pipefail
        npm run typecheck 2>&1 | tee ../../subscription-native-proof/typecheck.log
    - name: Build desktop
      working-directory: source/apps/desktop
      run: |
        set -euo pipefail
        npm run build 2>&1 | tee ../../subscription-native-proof/build.log
    - name: Prove a real macOS Electron window is available
      timeout-minutes: 3
      run: |
        set -euo pipefail
        node --input-type=module <<'JS' 2>&1 | tee subscription-native-proof/native-display.log
        import assert from 'node:assert/strict'
        import fs from 'node:fs'
        import os from 'node:os'
        import path from 'node:path'
        import { createRequire } from 'node:module'
        import { _electron } from '@playwright/test'
        const require = createRequire(path.resolve('apps/desktop/package.json'))
        assert.equal(process.platform, 'darwin')
        const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'eidolon-native-display-'))
        fs.writeFileSync(path.join(tmp, 'package.json'), JSON.stringify({ name: 'eidolon-native-display-proof', main: 'main.cjs' }))
        fs.writeFileSync(path.join(tmp, 'main.cjs'), `
          const { app, BrowserWindow, session } = require('electron');
          app.setPath('userData', ${JSON.stringify(path.join(tmp, 'user-data'))});
          app.whenReady().then(() => {
            session.defaultSession.webRequest.onBeforeRequest((details, callback) => callback({ cancel: !/^(data|file|devtools):/.test(details.url) }));
            const window = new BrowserWindow({ width: 640, height: 480, show: true, backgroundColor: '#ffffff' });
            window.loadURL('data:text/html,<h1>Native macOS display proof</h1>');
          });
          app.on('window-all-closed', () => app.quit());
        `)
        let application
        try {
          application = await _electron.launch({ executablePath: require('electron'), args: [tmp], timeout: 30000 })
          const page = await application.firstWindow({ timeout: 30000 })
          await page.getByRole('heading', { name: 'Native macOS display proof' }).waitFor()
          const host = await application.evaluate(({ app, screen, BrowserWindow }) => ({
            platform: process.platform,
            architecture: process.arch,
            electronVersion: process.versions.electron,
            appReady: app.isReady(),
            displays: screen.getAllDisplays().map(display => ({ bounds: display.bounds, scaleFactor: display.scaleFactor })),
            visibleWindows: BrowserWindow.getAllWindows().filter(window => window.isVisible()).length,
          }))
          fs.writeFileSync('subscription-native-proof/native-display.json', JSON.stringify(host, null, 2))
          assert.equal(host.platform, 'darwin')
          assert.equal(host.appReady, true)
          assert.ok(host.displays.some(display => display.bounds.width > 0 && display.bounds.height > 0), 'Hosted macOS session has no usable native display')
          assert.equal(host.visibleWindows, 1)
          const capture = await page.screenshot({ path: 'subscription-native-proof/native-display.png' })
          assert.ok(capture.length > 100)
          console.log(JSON.stringify(host))
        } catch (error) {
          fs.writeFileSync('subscription-native-proof/native-display-failure.txt', String(error))
          throw error
        } finally {
          try { await application?.close() } finally { fs.rmSync(tmp, { recursive: true, force: true }) }
        }
        JS
    - name: Record the journey interpreter and loaded SQLite before native UI
      run: |
        set -euo pipefail
        test "$HERMES_DESKTOP_PYTHON" = "$HERMES_PYTHON"
        "$HERMES_PYTHON" -B - <<'PYTHON'
        import json, os, pathlib, sys
        selected = {key: os.environ[key] for key in ('HERMES_PYTHON', 'HERMES_DESKTOP_PYTHON')}
        assert all(pathlib.Path(value).samefile(sys.executable) for value in selected.values())
        with open('readonly-native-proof/selected-interpreter.json', 'x') as output:
            json.dump({'selected': selected, 'actualExecutable': sys.executable,
                       'scope': 'selected interpreter plus before/after loaded-image identity; no separate per-gateway SQLite receipt'}, output, indent=2)
        PYTHON
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/run.py" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --output "$PWD/readonly-native-proof/before-journeys" --suite identity
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/verify_evidence.py" --evidence "$PWD/readonly-native-proof/before-journeys" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --suite identity
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" compare-runtime --before readonly-native-proof/mechanism/runtime.json --after readonly-native-proof/before-journeys/runtime.json --preflight readonly-native-proof/preflight.json --output readonly-native-proof/mechanism-journey-runtime.json
    - name: Verify native subscription setup and unchanged fresh API route
      timeout-minutes: 25
      working-directory: source/apps/desktop
      env:
        EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
      run: |
        set -euo pipefail
        npx playwright test e2e/subscription-native-journey.spec.ts e2e/organization-fresh-team-setup.spec.ts --workers=1 --retries=0 --global-timeout=1200000 2>&1 | tee ../../subscription-native-proof/playwright.log
    - name: Verify unchanged interpreter and SQLite after native UI
      if: always()
      run: |
        set -euo pipefail
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/run.py" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --output "$PWD/readonly-native-proof/after-journeys" --suite identity
        "$HERMES_PYTHON" -B "$READONLY_HARNESS/verify_evidence.py" --evidence "$PWD/readonly-native-proof/after-journeys" --source-root "$PWD" --store-sha256 "$READONLY_STORE_SHA256" --expected-head "$SUBSCRIPTION_PROOF_SHA" --expected-tree "$SUBSCRIPTION_PROOF_TREE" --suite identity
        "$HERMES_PYTHON" -B "$READONLY_WORKFLOW/workflow_gate.py" compare-runtime --before readonly-native-proof/before-journeys/runtime.json --after readonly-native-proof/after-journeys/runtime.json --preflight readonly-native-proof/preflight.json --output readonly-native-proof/final-journey-runtime.json
    - name: Require every native subscription and fresh API journey without retries
      run: |
        set -euo pipefail
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict'
        import fs from 'node:fs'
        const report = JSON.parse(fs.readFileSync('apps/desktop/playwright-report/results.json', 'utf8'))
        assert.equal(report.errors?.length ?? 0, 0, 'Playwright reported global errors')
        const specs = []
        function collect(suite) {
          specs.push(...(suite.specs ?? []))
          for (const child of suite.suites ?? []) collect(child)
        }
        for (const suite of report.suites ?? []) collect(suite)
        const required = [
          ['subscription-native-journey.spec.ts', 'fresh profile consents, chooses policy, reviews Improve, generates and explicitly creates'],
          ['subscription-native-journey.spec.ts', 'legacy-empty profile consents, chooses policy, reviews Improve, generates and explicitly creates'],
          ['subscription-native-journey.spec.ts', 'uncertain synthetic inference blocks a new intent without retry or refund'],
          ['subscription-native-journey.spec.ts', 'known unsent inference recovers through one explicit retry without losing debt'],
          ['subscription-native-journey.spec.ts', 'initial publication refusal recovers locally before explicit new consent'],
          ['subscription-native-journey.spec.ts', 'stranded unsent inference reconciles locally before one explicit retry'],
          ['subscription-native-journey.spec.ts', 'second open-window refusal recovers locally before explicit new consent'],
          ['subscription-native-journey.spec.ts', 'legacy host identity requires explicit migration, cancel and editor reopen, with retained debt and fresh policy'],
          ['organization-fresh-team-setup.spec.ts', 'two fresh isolated organizations configure their own models and explicitly review and create synthetic teams'],
        ]
        assert.equal(required.length, 9, 'Expected exactly nine required native/API titles')
        assert.equal(required.filter(([file]) => file === 'subscription-native-journey.spec.ts').length, 8, 'Expected exactly eight teardown-gated subscription journeys')
        function exactKeys(value, keys, label) {
          assert.ok(value !== null && typeof value === 'object' && !Array.isArray(value), `${label}: expected an object`)
          assert.deepEqual(Object.keys(value).sort(), [...keys].sort(), `${label}: unexpected keys`)
        }
        function requireTeardown(result, title) {
          const receipts = (result.attachments ?? []).filter(attachment => attachment.name === 'subscription-teardown-diagnostic')
          assert.equal(receipts.length, 1, `Missing or duplicated teardown receipt: ${title}`)
          const attachment = receipts[0]
          assert.equal(attachment.contentType, 'application/json', `Wrong teardown receipt content type: ${title}`)
          assert.ok(typeof attachment.body === 'string' && attachment.body.length > 0 && attachment.body.length <= 5464, `Missing or oversized teardown receipt body: ${title}`)
          assert.match(attachment.body, /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/, `Malformed teardown receipt base64: ${title}`)
          const bytes = Buffer.from(attachment.body, 'base64')
          assert.ok(bytes.length > 0 && bytes.length <= 4096, `Oversized decoded teardown receipt: ${title}`)
          assert.equal(bytes.toString('base64'), attachment.body, `Noncanonical teardown receipt base64: ${title}`)
          const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes)
          const receipt = JSON.parse(text)
          // JSON.parse alone silently accepts repeated keys, including escaped aliases.
          const tokens = text.match(/"(?:\\.|[^"\\])*"|[{}\[\]:,]/g) ?? []
          const stack = []
          for (let index = 0; index < tokens.length; index++) {
            const token = tokens[index]
            if (token === '{') stack.push(new Set())
            else if (token === '[') stack.push(null)
            else if (token === '}' || token === ']') stack.pop()
            else if (token.startsWith('"') && tokens[index + 1] === ':') {
              const key = JSON.parse(token)
              assert.ok(stack.at(-1) instanceof Set && !stack.at(-1).has(key), `Duplicated teardown receipt key: ${title}`)
              stack.at(-1).add(key)
            }
          }
          exactKeys(receipt, ['version', 'lifecycle', 'cleanupError', 'remaining'], `Teardown receipt ${title}`)
          assert.equal(receipt.version, 1, `Unsupported teardown receipt version: ${title}`)
          assert.equal(receipt.cleanupError, 'none', `Teardown cleanup failed: ${title}`)
          const lifecycle = receipt.lifecycle
          exactKeys(lifecycle, ['phase', 'reason', 'capturedCount', 'initialLive', 'remainingLive', 'rootExited'], `Teardown lifecycle ${title}`)
          assert.equal(lifecycle.phase, 'settled', `Teardown did not settle: ${title}`)
          assert.equal(lifecycle.reason, 'none', `Teardown lifecycle refused: ${title}`)
          assert.ok(Number.isInteger(lifecycle.capturedCount) && lifecycle.capturedCount >= 1 && lifecycle.capturedCount <= 65, `Invalid captured process count: ${title}`)
          assert.ok(Number.isInteger(lifecycle.initialLive) && lifecycle.initialLive >= 0 && lifecycle.initialLive <= lifecycle.capturedCount, `Invalid initially live process count: ${title}`)
          assert.equal(lifecycle.remainingLive, 0, `Teardown left live processes: ${title}`)
          assert.equal(lifecycle.rootExited, true, `Teardown root exit is unverified: ${title}`)
          const remaining = receipt.remaining
          exactKeys(remaining, ['state', 'truncated', 'counts'], `Teardown remaining entries ${title}`)
          assert.equal(remaining.state, 'removed', `Teardown sandbox was not removed: ${title}`)
          assert.equal(remaining.truncated, false, `Teardown remaining entries were truncated: ${title}`)
          const categories = ['home', 'userData', 'userHome', 'evidence', 'observer', 'other']
          exactKeys(remaining.counts, categories, `Teardown remaining counts ${title}`)
          for (const category of categories) assert.equal(remaining.counts[category], 0, `Teardown left ${category} entries: ${title}`)
        }
        for (const [file, title] of required) {
          const matches = specs.filter(spec => spec.file?.replaceAll('\\', '/').endsWith(file) && spec.title === title)
          assert.equal(matches.length, 1, `Missing or duplicated native case: ${title}`)
          const tests = matches[0].tests ?? []
          assert.equal(tests.length, 1, `Missing or duplicated native execution: ${title}`)
          const test = tests[0]
          assert.equal(test.status, 'expected', `Native case did not pass: ${title}`)
          assert.equal(test.results?.length, 1, `Native case did not run exactly once: ${title}`)
          assert.equal(test.results[0].status, 'passed', `Native case skipped or failed: ${title}`)
          assert.equal(test.results[0].retry, 0, `Native case retried: ${title}`)
          if (file === 'subscription-native-journey.spec.ts') requireTeardown(test.results[0], title)
          console.log(`${file}: ${title}: passed once`)
        }
        JS
    - name: Record source integrity after verification
      if: always()
      run: |
        set -euo pipefail
        mkdir -p subscription-native-proof
        test "$(git rev-parse HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SUBSCRIPTION_PROOF_TREE"
        git rev-parse HEAD 'HEAD^{tree}' HEAD:apps/desktop/src HEAD:apps/desktop/e2e > subscription-native-proof/final-source.txt
        cmp subscription-native-proof/source.txt subscription-native-proof/final-source.txt
        test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
        git diff --cached --exit-code
        git status --short > subscription-native-proof/worktree-status.txt
        git diff --exit-code > subscription-native-proof/tracked-diff.txt
    - name: Retain source receipts, native screenshots, traces, and reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: subscription-readonly-native-macos-3.12-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          source/subscription-native-proof/
          source/apps/desktop/test-results/
          source/apps/desktop/playwright-report/

          source/readonly-native-proof/
        retention-days: 7
        if-no-files-found: error
