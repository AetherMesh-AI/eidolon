name: PR208 actual-main packaged macOS proof

on:
  push:
    branches: [proof/pr208-actual-main-bundle-20261019]

permissions:
  contents: read

concurrency:
  group: pr208-packaged-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  # Packaging preserves the main-only build identity policy. PRs have no packaged-product verdict.
  packaged-macos:
    name: Organization actual-main packaged Eidolon journey (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: harness
    env:
      EIDOLON_PACKAGED_PROOF_SHA: 6c071ecac21ee8143b2d34a43b1670e159f0811e
      EIDOLON_PACKAGED_HARNESS_SHA: b14dc42c99d62fc965d07ca1199ee6996775986c
      EIDOLON_PACKAGED_EVENT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b14dc42c99d62fc965d07ca1199ee6996775986c
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c071ecac21ee8143b2d34a43b1670e159f0811e
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact product, harness and native host
        run: |
          set -euo pipefail
          mkdir -p ../packaged-macos-proof
          test "$(uname -s)" = Darwin
          test -x /usr/bin/sandbox-exec
          product="$(cd ../product && pwd -P)"
          harness="$(pwd -P)"
          test "$(git -C "$product" rev-parse 'HEAD^{tree}')" = 008fc3f0a6d66706aa3886a6e0ffed71c2682581
          test "$(git -C "$harness" rev-parse 'HEAD^{tree}')" = 13e85fbdf397872a3fac51bdfa3ad80a7befc612
          test "$(git -C "$product" rev-parse HEAD)" = "$EIDOLON_PACKAGED_PROOF_SHA"
          test "$(git -C "$harness" rev-parse HEAD)" = "$EIDOLON_PACKAGED_HARNESS_SHA"
          test "$(git -C "$product" rev-parse refs/remotes/origin/main)" = "$EIDOLON_PACKAGED_PROOF_SHA"
          for name in product harness; do
            checkout="${!name}"
            test "$(git -C "$checkout" write-tree)" = "$(git -C "$checkout" rev-parse 'HEAD^{tree}')"
            test -z "$(git -C "$checkout" status --porcelain --untracked-files=all)"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "../packaged-macos-proof/$name-source.txt"
          done
          printf 'EIDOLON_PACKAGED_PRODUCT_ROOT=%s\n' "$product" >> "$GITHUB_ENV"
          printf 'EIDOLON_PACKAGED_HARNESS_ROOT=%s\n' "$harness" >> "$GITHUB_ENV"
          printf 'EIDOLON_PACKAGED_PROOF_TREE=%s\n' "$(git -C "$product" rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          printf 'EIDOLON_PACKAGED_HARNESS_TREE=%s\n' "$(git -C "$harness" rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          printf '%s\n' "$EIDOLON_PACKAGED_EVENT_SHA" > ../packaged-macos-proof/event-sha.txt
          { sw_vers; uname -a; } > ../packaged-macos-proof/host.txt
          for name in CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_NOTARY_PROFILE APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -z "${!name:-}" || { echo "Unexpected signing configuration: $name" >&2; exit 1; }
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked product and harness dependencies
        run: |
          set -euo pipefail
          cmp "$EIDOLON_PACKAGED_PRODUCT_ROOT/package-lock.json" "$EIDOLON_PACKAGED_HARNESS_ROOT/package-lock.json"
          python -m pip install uv==0.12.23
          (cd "$EIDOLON_PACKAGED_PRODUCT_ROOT" && GITHUB_SHA="$EIDOLON_PACKAGED_PROOF_SHA" uv sync --locked --python 3.12 --extra dev && GITHUB_SHA="$EIDOLON_PACKAGED_PROOF_SHA" npm ci)
          if test "$EIDOLON_PACKAGED_HARNESS_ROOT" != "$EIDOLON_PACKAGED_PRODUCT_ROOT"; then
            (cd "$EIDOLON_PACKAGED_HARNESS_ROOT" && npm ci)
          fi
          printf 'HERMES_PYTHON=%s/.venv/bin/python\n' "$EIDOLON_PACKAGED_PRODUCT_ROOT" >> "$GITHUB_ENV"
      - name: Verify packaged resolver, negative controls and desktop types
        working-directory: harness/apps/desktop
        run: |
          set -euo pipefail
          node --test scripts/check-packaged-macos-proof.test.cjs 2>&1 | tee ../../../packaged-macos-proof/gate-tests.log
          npx vitest run --project electron e2e/packaged-binary.unit.test.ts 2>&1 | tee ../../../packaged-macos-proof/resolver-tests.log
          npm run typecheck 2>&1 | tee ../../../packaged-macos-proof/typecheck.log
      - name: Build the actual-main Eidolon app without publishing
        run: |
          set -euo pipefail
          cd "$EIDOLON_PACKAGED_PRODUCT_ROOT"
          test "$(git rev-parse HEAD)" = "$EIDOLON_PACKAGED_PROOF_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EIDOLON_PACKAGED_PROOF_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          # Event identity stays separate; only product build commands get product HEAD.
          GITHUB_SHA="$EIDOLON_PACKAGED_PROOF_SHA" "$HERMES_PYTHON" eidolon_cli/eidolon_version.py --require-verified > ../packaged-macos-proof/product-identity.json
          cd apps/desktop
          # Existing command and signing policy, including --dir and --publish never.
          GITHUB_SHA="$EIDOLON_PACKAGED_PROOF_SHA" npm run pack 2>&1 | tee ../../../packaged-macos-proof/pack.log
      - name: Verify actual-main freshness immediately before launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observation="$(gh api repos/AetherMesh-AI/Eidolon/git/ref/heads/main --jq '[.ref,.object.sha] | @tsv')"
          IFS=$'\t' read -r ref tip <<< "$observation"
          test "$ref" = refs/heads/main
          test "$tip" = "$EIDOLON_PACKAGED_PROOF_SHA" || { echo 'Actual main changed; refusing stale product proof' >&2; exit 1; }
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'EIDOLON_PACKAGED_REMOTE_MAIN=%s\nEIDOLON_PACKAGED_MAIN_VERIFIED_AT=%s\n' "$tip" "$verified_at" >> "$GITHUB_ENV"
          printf '{"repository":"AetherMesh-AI/Eidolon","ref":"refs/heads/main","remoteTip":"%s","verifiedAt":"%s"}\n' "$tip" "$verified_at" > ../packaged-macos-proof/main-freshness.json
      - name: Require real packaged startup and synthetic subscription journey
        timeout-minutes: 8
        working-directory: harness/apps/desktop
        env:
          EIDOLON_TEST_PACKAGED_APP: '1'
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: |
          set -euo pipefail
          node scripts/check-packaged-macos-proof.cjs --write-expected "$EIDOLON_PACKAGED_HARNESS_ROOT" ../../../packaged-macos-proof/expected.json
          npx playwright test e2e/subscription-native-journey.spec.ts --grep 'host-native subscription setup fresh profile consents, chooses policy, reviews Improve, generates and explicitly creates$' --workers=1 --retries=0 --global-timeout=420000 2>&1 | tee ../../../packaged-macos-proof/playwright.log
      - name: Require product, harness, native ABI, backend and teardown receipts
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/check-packaged-macos-proof.cjs apps/desktop/playwright-report/results.json ../packaged-macos-proof/expected.json ../packaged-macos-proof/accepted.json
      - name: Verify both source identities after packaged acceptance
        if: always()
        run: |
          set -euo pipefail
          product="$EIDOLON_PACKAGED_PRODUCT_ROOT"
          harness="$EIDOLON_PACKAGED_HARNESS_ROOT"
          test "$(git -C "$product" rev-parse HEAD)" = "$EIDOLON_PACKAGED_PROOF_SHA"
          test "$(git -C "$harness" rev-parse HEAD)" = "$EIDOLON_PACKAGED_HARNESS_SHA"
          for name in product harness; do
            checkout="${!name}"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "../packaged-macos-proof/final-$name-source.txt"
            cmp "../packaged-macos-proof/$name-source.txt" "../packaged-macos-proof/final-$name-source.txt"
            test "$(git -C "$checkout" write-tree)" = "$(git -C "$checkout" rev-parse 'HEAD^{tree}')"
            git -C "$checkout" diff --exit-code
            git -C "$checkout" diff --cached --exit-code
            git -C "$checkout" status --short > "../packaged-macos-proof/$name-worktree-status.txt"
            test ! -s "../packaged-macos-proof/$name-worktree-status.txt"
          done
      - name: Retain actual-main packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packaged-macos-proof/
            harness/apps/desktop/test-results/
            harness/apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: error

