name: Subscription backend vertical diagnostic
on:
  push:
    branches: [temp/subscription-setup-backend-proof]
permissions:
  contents: read
concurrency:
  group: subscription-backend-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  EIDOLON_OLD_RUNTIME_PATH: ${{ github.workspace }}/old-runtime
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  proof:
    name: Subscription backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cbe9a90b0c74410f3ab7dba630c2ce28c7b34b4b
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          path: old-runtime
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact source and old runtime
        run: |
          test "$(git rev-parse HEAD)" = cbe9a90b0c74410f3ab7dba630c2ce28c7b34b4b
          test "$(git rev-parse HEAD^{tree})" = 49d941c78273ad4e77fbce730536885bb65933e9
          test "$(git -C ../old-runtime rev-parse HEAD)" = 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          test "$(git -C ../old-runtime rev-parse HEAD^{tree})" = 719349cb69ed9fb7bbc2e6aeabb1ffabc8e08e3b
          python -c "import platform; print(platform.system(), platform.machine())"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Canonical synthetic vertical and API regressions
        run: |
          set -o pipefail
          scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_setup_subscription_http.py tests/eidolon_cli/test_organization_setup_subscription_catalog.py tests/eidolon_cli/test_organization_setup_subscription_refresh.py tests/eidolon_cli/test_organization_setup_subscription_revocation.py tests/eidolon_cli/test_organization_setup_subscription_auth.py tests/eidolon_cli/test_organization_setup_subscription_policy.py tests/eidolon_cli/test_organization_setup_subscription_policy_integration.py tests/eidolon_cli/test_organization_setup_subscription_transport.py tests/eidolon_cli/test_organization_setup_subscription_usage.py tests/eidolon_cli/test_organization_setup_subscription_admission.py tests/eidolon_cli/test_organization_team_subscription_generation.py tests/eidolon_cli/test_organization_team_admission.py tests/eidolon_cli/test_organization_team_budget.py tests/eidolon_cli/test_organization_team_generation.py tests/eidolon_cli/test_organization_team_setup.py tests/eidolon_cli/test_organization_owner_policy.py tests/tui_gateway/test_organization_setup_subscription.py tests/tui_gateway/test_organization_setup_subscription_flow.py tests/tui_gateway/test_organization_setup_subscription_preflight.py 2>&1 | tee backend-tests.log
      - name: Protected store and host regressions
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_setup_subscription_host.py -k test_windows_production_refuses_before_lock_import 2>&1 | tee -a backend-tests.log
            scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_setup_subscription_store.py -k 'test_production_platforms_fail_closed_without_native_read or test_darwin_acl_boundary_with_synthetic_c_api or nonblocking or attestation' 2>&1 | tee -a backend-tests.log
          else
            scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_setup_subscription_store.py tests/eidolon_cli/test_organization_setup_subscription_host.py tests/eidolon_cli/test_setup_subscription_export_security.py 2>&1 | tee -a backend-tests.log
          fi
      - name: Retain bounded test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subscription-backend-${{ matrix.os }}
          path: source/backend-tests.log
          if-no-files-found: ignore
          retention-days: 7
