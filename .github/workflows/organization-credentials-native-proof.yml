name: Organization credentials native proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'tui_gateway/ws.py'
      - 'tui_gateway/server.py'
      - 'eidolon_cli/web_routers/chat_ws.py'
      - 'eidolon_cli/organization_service.py'
      - 'eidolon_cli/organization_executor.py'
      - 'apps/desktop/src/app/settings/index.tsx'
      - 'apps/desktop/src/app/eidolon/use-organization-metadata.ts'
      - 'apps/desktop/src/app/eidolon/runtime-provider.ts'
      - 'apps/shared/src/json-rpc-gateway.ts'
      - 'apps/desktop/src/app/eidolon/organization-credentials*'
      - 'apps/desktop/src/i18n/organization-credentials.ts'
      - 'eidolon_cli/organization_credential*.py'
      - 'eidolon_cli/organization_credentials.py'
      - 'tui_gateway/methods_organization_credentials.py'
      - 'tui_gateway/organization_credential_transport.py'
      - 'apps/desktop/e2e/organization-credentials-native.spec.ts'
      - 'apps/desktop/e2e/organization-credentials-native-fixture.ts'
      - 'scripts/ci/organization_credentials_native_fixture.py'
      - 'tests/test_organization_credentials_native_fixture.py'
      - '.github/workflows/organization-credentials-native-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-native-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  owner-controls:
    name: Credential owner UI and secure input (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing locked Python runtime and tests
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify API-only fixture setup
        run: scripts/run_tests.sh tests/test_organization_credentials_native_fixture.py -j 1
      - name: Install existing locked desktop dependencies
        run: npm ci
      - name: Install existing Electron system dependencies
        run: sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
      - name: Check types and build desktop
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run build
      - name: Verify real owner credential UI with synthetic storage and dispatch disabled
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test e2e/organization-credentials-native.spec.ts --workers=1 --retries=0
      - name: Retain native proof and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: credential-owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: warn
          retention-days: 7
  native-storage:
    name: Synthetic credential storage (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin
            marker: macos_only
          - runner: windows-latest
            platform: win32
            marker: windows_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing locked native test runtime
        shell: bash
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.11 --extra dev
      - name: Run one real native storage case without retries
        shell: bash
        run: |
          mkdir -p native-credential-proof
          uv run --no-sync python -c "import sys; assert sys.platform == '${{ matrix.platform }}'"
          scripts/run_tests.sh tests/eidolon_cli/test_organization_credential_native.py -j 1 \
            -m '${{ matrix.marker }}' --junitxml=native-credential-proof/results.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('native-credential-proof/results.xml').iter('testcase'))
          assert len(cases) == 1, 'Expected exactly one selected native test'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
          git rev-parse HEAD > native-credential-proof/source.txt
      - name: Retain exact native source and JUnit proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: credential-native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-credential-proof
          if-no-files-found: warn
          retention-days: 7
