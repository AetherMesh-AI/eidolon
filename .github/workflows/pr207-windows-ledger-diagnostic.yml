name: PR207 Windows ledger diagnostic

on:
  push:
    branches: [proof/pr207-windows-ledger-20261019]

permissions:
  contents: read

jobs:
  observe:
    name: Windows ledger terminal evidence (diagnostic only)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      HERMES_TEST_FILE_RETRIES: '0'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - name: Check out reviewed diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostics
          persist-credentials: false
      - name: Check out immutable actual-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c071ecac21ee8143b2d34a43b1670e159f0811e
          path: subject
          persist-credentials: false
      - name: Require exact source and source tree
        run: |
          test "$(git -C subject rev-parse HEAD)" = 6c071ecac21ee8143b2d34a43b1670e159f0811e
          test "$(git -C subject rev-parse 'HEAD^{tree}')" = 008fc3f0a6d66706aa3886a6e0ffed71c2682581
          test -z "$(git -C subject status --porcelain --untracked-files=no)"
      - name: Set up canonical Windows Python selector
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install unchanged locked test dependencies
        working-directory: subject
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Prepare external launcher and source receipts
        run: |
          subject/.venv/Scripts/python.exe diagnostics/scripts/ci/pr207_windows_ledger_diagnostic.py prepare \
            --subject "$GITHUB_WORKSPACE/subject" \
            --evidence "$GITHUB_WORKSPACE/evidence" \
            --launcher "$RUNNER_TEMP/pr207-windows-ledger.sh"
      - name: Observe the unchanged full Windows ledger lane once
        # All 50 files, j3, zero retries, 600s retention/300s other file caps,
        # native 30s dump and Python-thread 30s collector remain unchanged.
        # The external wrapper only retains terminal output and exit receipts.
        run: bash "$RUNNER_TEMP/pr207-windows-ledger.sh"
      - name: Retain existing phase and stack evidence without oversized console output
        if: always()
        run: |
          subject/.venv/Scripts/python.exe diagnostics/scripts/ci/pr207_windows_ledger_diagnostic.py sanitize \
            --subject "$GITHUB_WORKSPACE/subject" \
            --evidence "$GITHUB_WORKSPACE/evidence"
      - name: Require unchanged tracked source after observation
        if: always()
        run: |
          test "$(git -C subject rev-parse HEAD)" = 6c071ecac21ee8143b2d34a43b1670e159f0811e
          test "$(git -C subject rev-parse 'HEAD^{tree}')" = 008fc3f0a6d66706aa3886a6e0ffed71c2682581
          test -z "$(git -C subject status --porcelain --untracked-files=no)"
      - name: Retain full child output and diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr207-windows-ledger-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/pytest-output/
            evidence/native-output/
            evidence/timing/sanitized/
          if-no-files-found: error
          retention-days: 7
