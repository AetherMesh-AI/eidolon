name: Temporary team setup backend proof
on:
  push:
    branches: [temp/team-setup-review-proof]
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  team-setup:
    name: Canonical bounded team setup contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f617aa7e87c638e87ec2037e7cfa807e9ce8ed58
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev --extra slack
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "f617aa7e87c638e87ec2037e7cfa807e9ce8ed58"
          test "$(git rev-parse HEAD^{tree})" = "4d9d92ef5d372e1b831136ff44ca21cddb5657de"
          git rev-parse HEAD HEAD^{tree} > team-setup-source.txt
      - name: Run canonical synthetic setup contracts without retry
        run: |
          set -o pipefail
          scripts/run_tests.sh tests/eidolon_cli/test_organization_team_setup.py tests/eidolon_cli/test_organization_team_generation.py tests/eidolon_cli/test_organization_team_admission.py tests/tui_gateway/test_organization_team_setup.py -j 2 -q 2>&1 | tee team-setup-backend.log
          .venv/bin/ruff check eidolon_cli/organization_team_setup.py eidolon_cli/organization_team_generation.py eidolon_cli/organization_team_admission.py tui_gateway/methods_organization_team_setup.py
      - name: Retain bounded proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: team-setup-backend-proof
          path: |
            team-setup-source.txt
            team-setup-backend.log
          retention-days: 7
