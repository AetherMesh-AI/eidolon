name: Publish requested v0.5.0-alpha once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v05-once.yml']

permissions:
  contents: read

# Serialize all manual releases, including different tags. Never cancel a publisher.
concurrency:
  group: eidolon-manual-release
  cancel-in-progress: false

env:
  RELEASE_MODE: new-release
  SOURCE_SHA: 88ba96dd29dd80031fc5ee8a507f097d2860833b
  RELEASE_TAG: v0.5.0-alpha
  RELEASE_CHANGELOG: pending-verified-notes

jobs:
  preflight:
    if: github.repository == 'AetherMesh-AI/Eidolon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify pinned source and reviewed release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYNOTES'
          import hashlib, json, os, pathlib, subprocess, urllib.request, uuid
          expected = '7682f9c342035e9ec3f236a894925be8c417a2ed16b270f1fa21cc7226a17326'
          url = 'https://api.github.com/repos/AetherMesh-AI/eidolon/issues/comments/6184363076'
          req = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'Eidolon-release','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=60) as response:
              body = json.load(response)['body']
          if hashlib.sha256(body.encode()).hexdigest() != expected:
              raise SystemExit('Release notes changed; refusing publication')
          if subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != os.environ['SOURCE_SHA']:
              raise SystemExit('Source checkout differs from pinned release commit')
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], check=True)
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], text=True).splitlines()
          if changed != ['.github/workflows/publish-v05-once.yml']:
              raise SystemExit('Wrapper delta contains unexpected source changes')
          delimiter = 'NOTES_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('RELEASE_CHANGELOG<<'+delimiter+'\n'+body+'\n'+delimiter+'\n')
          PYNOTES
      - name: Offline release policy tests
        run: python3 -m unittest discover -s .github/scripts -p 'test*release*.py'
      - name: Validate inputs and refuse existing tags or releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$SOURCE_SHA" python3 .github/scripts/manual_release.py preflight

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Verify pinned source and reviewed release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYNOTES'
          import hashlib, json, os, pathlib, subprocess, urllib.request, uuid
          expected = '7682f9c342035e9ec3f236a894925be8c417a2ed16b270f1fa21cc7226a17326'
          url = 'https://api.github.com/repos/AetherMesh-AI/eidolon/issues/comments/6184363076'
          req = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'Eidolon-release','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=60) as response:
              body = json.load(response)['body']
          if hashlib.sha256(body.encode()).hexdigest() != expected:
              raise SystemExit('Release notes changed; refusing publication')
          if subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != os.environ['SOURCE_SHA']:
              raise SystemExit('Source checkout differs from pinned release commit')
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], check=True)
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], text=True).splitlines()
          if changed != ['.github/workflows/publish-v05-once.yml']:
              raise SystemExit('Wrapper delta contains unexpected source changes')
          delimiter = 'NOTES_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('RELEASE_CHANGELOG<<'+delimiter+'\n'+body+'\n'+delimiter+'\n')
          PYNOTES
      - name: Native locked workspace install
        run: npm ci --include=dev --include=optional
      - name: Linux Electron runtime libraries for native addon smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Locate full 7-Zip for NSIS inspection
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $seven = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (-not $seven) {
            $dir = Join-Path $env:ProgramFiles '7-Zip'
            if (-not (Test-Path (Join-Path $dir '7z.exe'))) { throw 'Full 7-Zip is required for NSIS inspection' }
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build desktop and native payload on target architecture
        run: GITHUB_SHA="$SOURCE_SHA" npm run build --workspace apps/desktop
      - name: Package one installer or AppImage and verify native payload
        run: GITHUB_SHA="$SOURCE_SHA" python .github/scripts/manual_release.py package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/eidolon-release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false

  publish:
    if: github.repository == 'AetherMesh-AI/Eidolon' && github.ref == 'refs/heads/main'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify pinned source and reviewed release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYNOTES'
          import hashlib, json, os, pathlib, subprocess, urllib.request, uuid
          expected = '7682f9c342035e9ec3f236a894925be8c417a2ed16b270f1fa21cc7226a17326'
          url = 'https://api.github.com/repos/AetherMesh-AI/eidolon/issues/comments/6184363076'
          req = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'Eidolon-release','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=60) as response:
              body = json.load(response)['body']
          if hashlib.sha256(body.encode()).hexdigest() != expected:
              raise SystemExit('Release notes changed; refusing publication')
          if subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != os.environ['SOURCE_SHA']:
              raise SystemExit('Source checkout differs from pinned release commit')
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], check=True)
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['GITHUB_SHA']], text=True).splitlines()
          if changed != ['.github/workflows/publish-v05-once.yml']:
              raise SystemExit('Wrapper delta contains unexpected source changes')
          delimiter = 'NOTES_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('RELEASE_CHANGELOG<<'+delimiter+'\n'+body+'\n'+delimiter+'\n')
          PYNOTES
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Create new tag, stage draft, verify exactly five assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: GITHUB_SHA="$SOURCE_SHA" python3 .github/scripts/manual_release.py publish
