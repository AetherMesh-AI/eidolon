name: Temporary organization workspace boundary proof
on:
  push:
    branches: [temp/organization-workspace-proof]
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  organization-workspace:
    name: Canonical organization workspace and legacy contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d406ed2ed895e2f5ca50cdb1c9cc9ebca7315c7c
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev --extra slack
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "d406ed2ed895e2f5ca50cdb1c9cc9ebca7315c7c"
          test "$(git rev-parse HEAD^{tree})" = "be5fcc4e50f4428bffeb7f910a15f7ea274b4a3d"
          git rev-parse HEAD HEAD^{tree} > organization-workspace-source.txt
      - name: Run new workspace boundary contracts without retry
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 NODE_DISABLE_COMPILE_CACHE=1 HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_workspaces.py tests/tui_gateway/test_organization_workspaces.py -- -q -p no:cacheprovider --tb=short 2>&1 | tee organization-workspace-backend.log
      - name: Run affected legacy contracts without retry
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 NODE_DISABLE_COMPILE_CACHE=1 HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_executor.py tests/eidolon_cli/test_runtime_provider_resolution.py tests/eidolon_cli/test_runtime_provider_late_binding.py tests/eidolon_cli/test_auth_profile_fallback.py tests/eidolon_cli/test_auth_provider_scope.py tests/eidolon_cli/test_auth_store_read_failure.py tests/eidolon_cli/test_auth_store_lock_concurrent.py tests/eidolon_cli/test_auth_codex_provider.py tests/eidolon_cli/test_config.py tests/eidolon_cli/test_env_loader.py tests/test_env_loader_secret_sources.py tests/agent/test_secret_scope.py tests/agent/test_credential_pool_profile_oauth_fork.py tests/agent/test_credential_pool_provider_boundary.py tests/agent/test_credential_pool_oauth_writethrough.py tests/agent/test_auxiliary_client.py tests/run_agent/test_openai_client_lifecycle.py tests/eidolon_cli/test_plugins.py tests/providers/test_provider_registry.py tests/test_eidolon_logging.py -- -q -p no:cacheprovider --tb=short 2>&1 | tee organization-workspace-legacy.log
      - name: Lint new boundary modules
        run: .venv/bin/ruff check eidolon_cli/profile_isolation.py eidolon_cli/organization_workspaces.py tui_gateway/methods_organization_workspaces.py
      - name: Retain bounded proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: organization-workspace-backend-proof
          path: |
            organization-workspace-source.txt
            organization-workspace-backend.log
            organization-workspace-legacy.log
          retention-days: 7
