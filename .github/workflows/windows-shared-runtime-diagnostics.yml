name: Windows shared runtime diagnostics

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-failure-diagnostics]

permissions:
  contents: read

concurrency:
  group: windows-shared-runtime-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  shared-runtime:
    name: Windows isolated shared runtime diagnosis
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Diagnose the unchanged two-thread conservation test
        run: |
          git rev-parse HEAD HEAD^{tree}
          .venv/Scripts/python.exe -c 'import platform, sqlite3; print(platform.platform()); print("SQLite", sqlite3.sqlite_version)'
          scripts/run_tests.sh tests/eidolon_cli/test_organization_shared_runtime.py \
            -j 1 --file-timeout 300 --file-retries 0 -- \
            --maxfail=1 --tb=long -vv -s \
            -p scripts.ci.organization_timing --organization-timing-dir=organization-timing \
            -o faulthandler_timeout=30 --junitxml=windows-shared-runtime.xml
      - name: Retain immediate failures and completed test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-shared-runtime-diagnostics
          path: |
            organization-timing/*.jsonl
            windows-shared-runtime.xml
          if-no-files-found: error
