name: Mac real source update proof
on:
  push:
    branches: ['test/mac-commit-update-20261008']
    paths: ['.github/workflows/mac-commit-update-e2e.yml', '.github/scripts/mac-update-e2e.mjs', 'eidolon_cli/main_desktop.py', 'tests/eidolon_cli/test_desktop_quarantine.py']
permissions:
  contents: read
jobs:
  actual-electron-source-update:
    name: Native source update (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      UV_PROJECT_ENVIRONMENT: venv
      SOURCE_COMMIT: 63ffc20b04f761c8514199e83c834eae1daa8b6c
      FIXTURE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          architecture: arm64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install pinned uv from PyPI
        run: python3 -m pip install uv==0.9.28
      - name: Prepare owned two-commit local origin on fixed main
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cp .github/scripts/mac-update-e2e.mjs "$RUNNER_TEMP/mac-update-e2e.mjs"
          mkdir -p "$RUNNER_TEMP/candidate"
          FILES=(eidolon_cli/main_desktop.py scripts/desktop-update/posix.sh scripts/desktop-update/mac_transaction.py scripts/desktop-update/mac_relaunch.py tests/eidolon_cli/test_gui_command.py tests/eidolon_cli/test_desktop_quarantine.py tests/test_desktop_update_macos_replacement.py)
          for file in "${FILES[@]}"; do
            mkdir -p "$RUNNER_TEMP/candidate/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/candidate/$file"
          done
          git checkout -B main "$SOURCE_COMMIT"
          if [ "$FIXTURE_VARIANT" = fixed ]; then
            for file in "${FILES[@]}"; do cp "$RUNNER_TEMP/candidate/$file" "$file"; done
          fi
          git config user.name 'Eidolon CI fixture'
          git config user.email 'ci-fixture@example.invalid'
          printf 'Synthetic owned update fixture A\n' > apps/desktop/public/mac-update-proof.txt
          git add apps/desktop/public/mac-update-proof.txt "${FILES[@]}"
          git commit -m "test: owned native update fixture A ($FIXTURE_VARIANT)"
          OLD=$(git rev-parse HEAD)
          printf 'Synthetic root-only commit; Desktop content is unchanged.\n' > mac-update-provenance-proof.txt
          git add mac-update-provenance-proof.txt
          git commit -m 'test: root-only update must refresh embedded commit provenance'
          NEW=$(git rev-parse HEAD)
          git clone --bare . "$RUNNER_TEMP/mac-update-origin.git"
          git remote set-url origin "$RUNNER_TEMP/mac-update-origin.git"
          git reset --hard "$OLD"
          echo "OLD_SHA=$OLD" >> "$GITHUB_ENV"
          echo "NEW_SHA=$NEW" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mac-update-evidence"
          printf '{"fixedBase":"%s","oldSha":"%s","newSha":"%s","sourceTransport":"local bare origin, real Git fetch","variant":"%s"}\n' "$SOURCE_COMMIT" "$OLD" "$NEW" "$FIXTURE_VARIANT" > "$RUNNER_TEMP/mac-update-evidence/source-fixture.json"
      - name: Install real runtime and locked desktop dependencies
        run: |
          uv sync --locked --python 3.11 --extra all --extra dev
          npm ci --include=dev --include=optional
      - name: Require source rebuild to preserve quarantine restrictions
        run: |
          # Do not execute the legacy broad quarantine-removal path. This is
          # a fail-closed safety gate, not a stubbed or skipped update test.
          python3 - <<'PY'
          from pathlib import Path
          source = Path('eidolon_cli/main_desktop.py').read_text()
          assert 'subprocess.run(["xattr", "-cr", str(app)]' not in source, 'BLOCKED: production rebuild unconditionally clears app xattrs; no quarantine bypass is authorized'
          PY
      - name: Native quarantine-preserving signing regression
        run: venv/bin/python -m pytest -q tests/eidolon_cli/test_gui_command.py tests/eidolon_cli/test_desktop_quarantine.py tests/test_desktop_update_macos_replacement.py
      - name: Build the old real application
        run: |
          mkdir -p "$RUNNER_TEMP/mac-old-build-home"
          env -u GITHUB_SHA -u GITHUB_REF_NAME HOME="$RUNNER_TEMP/mac-old-build-home" HERMES_HOME="$RUNNER_TEMP/mac-old-build-home/.eidolon" venv/bin/eidolon desktop --force-build --build-only
      - name: Exercise production IPC and two-version source update
        run: |
          EXPECT_STALE=false
          if [ "$FIXTURE_VARIANT" = baseline ]; then EXPECT_STALE=true; fi
          node "$RUNNER_TEMP/mac-update-e2e.mjs" \
            --app "$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Eidolon.app" \
            --source "$GITHUB_WORKSPACE" --old-sha "$OLD_SHA" --new-sha "$NEW_SHA" \
            --home "$RUNNER_TEMP/mac-update-isolated-home" \
            --build-stamp "$RUNNER_TEMP/mac-old-build-home/.eidolon/desktop-build-stamp.json" \
            --evidence "$RUNNER_TEMP/mac-update-evidence" --expect-stale-cache "$EXPECT_STALE"
      - name: Collect fixture diagnostics even after observer termination
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mac-update-evidence"
          LOGS="$RUNNER_TEMP/mac-update-isolated-home/.eidolon/logs"
          if [ -d "$LOGS" ]; then cp -R "$LOGS" "$RUNNER_TEMP/mac-update-evidence/postmortem-logs"; fi
          ps -axo pid,ppid,rss,comm > "$RUNNER_TEMP/mac-update-evidence/process-state.txt"
          vm_stat > "$RUNNER_TEMP/mac-update-evidence/vm-state.txt"
          /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "memorystatus" OR eventMessage CONTAINS "mac-update-e2e"' > "$RUNNER_TEMP/mac-update-evidence/process-termination.log" 2>&1 || true
      - name: Upload proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Eidolon-mac-source-update-proof-${{ matrix.variant }}
          path: ${{ runner.temp }}/mac-update-evidence
          retention-days: 14
          if-no-files-found: warn
