name: Synthetic trial exception diagnosis
on:
  push:
    branches: ['temp/trial-exception-diagnostic-195']
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact existing locked test environment
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev --extra slack
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install existing native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Run unchanged synthetic trial assertions with metadata-only diagnostics
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: |
          git rev-parse HEAD HEAD^{tree}
          sha256sum tests/eidolon_cli/test_organization_trial_driver.py
          scripts/run_tests.sh tests/eidolon_cli/test_organization_trial_driver.py -j 1 --file-retries 0 --file-timeout 300 --junitxml=trial-diagnostic.xml
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trial-exception-diagnostic
          path: '**/trial-diagnostic.xml'
          retention-days: 7
