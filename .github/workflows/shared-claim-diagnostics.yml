name: Shared claim contention diagnostics
on:
  push:
    branches: [fix/shared-claim-diagnostics]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
      - name: Reproduce concurrent admission with sanitized evidence
        shell: pwsh
        run: |
          git rev-parse HEAD
          for ($i = 0; $i -lt 20; $i++) {
            Write-Host "Concurrent fixture iteration $i"
            .venv/Scripts/python.exe -m pytest tests/eidolon_cli/test_organization_shared_runtime.py -k test_real_stores_conserve_allocation -vv --tb=long
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
