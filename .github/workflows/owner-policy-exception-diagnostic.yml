name: Owner policy exception diagnostic

on:
  push:
    branches: [diagnostic/owner-policy-exception-evidence]

permissions:
  contents: read

jobs:
  windows-policy-once:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      HERMES_TEST_FILE_RETRIES: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the canonical locked test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Run the original concurrent policy case once with immediate evidence
        run: |
          set -euo pipefail
          mkdir -p policy-diagnostic
          git rev-parse HEAD 'HEAD^{tree}' > policy-diagnostic/source.txt
          scripts/run_tests.sh -j 1 --file-retries 0 --file-timeout 300 tests/eidolon_cli/test_organization_owner_policy.py -- -k test_same_key_concurrent_apply_returns_one_receipt_and_one_generation -vv -s -p scripts.ci.organization_timing --organization-timing-dir="$PWD/policy-diagnostic/timing" --junitxml="$PWD/policy-diagnostic/results.xml" -o faulthandler_timeout=30 2>&1 | tee policy-diagnostic/test.log
      - name: Retain sanitized timing and immediate exceptions
        if: always()
        run: .venv/Scripts/python.exe -m scripts.ci.organization_timing policy-diagnostic/timing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: owner-policy-exception-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            policy-diagnostic/source.txt
            policy-diagnostic/results.xml
            policy-diagnostic/test.log
            policy-diagnostic/timing/sanitized/
          retention-days: 7
