name: Desktop update recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/desktop-update/**'
      - 'apps/desktop/electron/mac-update-preflight*'
      - 'apps/desktop/electron/main.ts'
      - 'tests/test_desktop_update_macos_replacement.py'
      - '.github/workflows/desktop-update-recovery.yml'
      - '.github/scripts/test-desktop-update-recovery-ui.mjs'
  push:
    branches: [main, 'fix/desktop-update-recovery-20261008']
    paths:
      - 'scripts/desktop-update/**'
      - 'apps/desktop/electron/mac-update-preflight*'
      - 'apps/desktop/electron/main.ts'
      - 'tests/test_desktop_update_macos_replacement.py'
      - '.github/workflows/desktop-update-recovery.yml'
      - '.github/scripts/test-desktop-update-recovery-ui.mjs'
permissions:
  contents: read
concurrency:
  group: desktop-update-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Install pinned test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0 psutil==7.2.2 PyYAML==6.0.3 python-dotenv==1.2.2
          npm ci --include=dev --include=optional
      - name: Prove denied replacement fails on the original updater
        if: github.ref == 'refs/heads/fix/desktop-update-recovery-20261008'
        run: |
          set -euo pipefail
          cp scripts/desktop-update/posix.sh "$RUNNER_TEMP/posix-recovery.sh"
          trap 'cp "$RUNNER_TEMP/posix-recovery.sh" scripts/desktop-update/posix.sh' EXIT
          git show ab3c8cd773a0fa2580cc7a13d019a812795fced6:scripts/desktop-update/posix.sh > scripts/desktop-update/posix.sh
          status=0
          scripts/run_tests.sh tests/test_desktop_update_macos_replacement.py -k 'keeps_denied and True' --tb=short > "$RUNNER_TEMP/updater-baseline.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/updater-baseline.log"
          test "$status" -eq 1
          grep -q 'assert True is not True' "$RUNNER_TEMP/updater-baseline.log"
      - name: Verify native bundle replacement, denial, interruption and rollback
        run: |
          scripts/run_tests.sh tests/test_desktop_update_macos_replacement.py tests/test_desktop_update_shim_progress.py tests/test_desktop_update_shim_profile_cleanup.py -j 2
      - name: Verify pre-quit and handoff contracts
        working-directory: apps/desktop
        run: |
          npx vitest run --project electron electron/mac-update-preflight.test.ts electron/handoff-result.test.ts electron/posix-update-home.test.ts electron/updater-process.test.ts scripts/desktop-update-ui.test.mjs
      - name: Verify recovery paths remain readable in the updater window
        run: node .github/scripts/test-desktop-update-recovery-ui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-update-recovery-ui
          path: replacement-evidence/
          retention-days: 14
          if-no-files-found: warn
