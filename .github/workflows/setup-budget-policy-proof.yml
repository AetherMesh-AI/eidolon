name: Reviewed setup budget policy proof
on:
  push:
    branches: [temp/setup-budget-policy-proof]
permissions:
  contents: read
jobs:
  setup-budget-native:
    name: Reviewed setup budget policy proof (Linux)
    runs-on: ubuntu-22.04
    # Real owner edits and visual evidence remain independently required.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 977d301696b86ab2882ee04a5b56ad53c63bbd3d
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "977d301696b86ab2882ee04a5b56ad53c63bbd3d"
          test "$(git rev-parse HEAD^{tree})" = "8bbc5863e8a415653aac42744f0c957aa10ffc73"
          printf '%s\n' '{"source":"977d301696b86ab2882ee04a5b56ad53c63bbd3d","tree":"8bbc5863e8a415653aac42744f0c957aa10ffc73"}' > setup-budget-source.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Install Electron system dependencies
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
          fc-match --format='%{family}\n' ':lang=ja'
      - name: Verify renderer and native types
        working-directory: apps/desktop
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.e2e.json --noEmit
      - name: Verify reviewed setup policy components
        working-directory: apps/desktop
        run: npx vitest run src/app/eidolon/team-onboarding-client.test.ts src/app/eidolon/team-setup-budget-client.test.ts src/app/eidolon/team-onboarding.test.tsx src/app/eidolon/team-setup-budget-editor.test.tsx --project ui --maxWorkers 1
      - name: Build desktop
        id: desktop-build
        working-directory: apps/desktop
        run: npm run build
      - name: Verify explicit budget review, retained charges and scoped recovery
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: setup-budget-report/results.json
        run: xvfb-run -a npx playwright test e2e/organization-team-setup-budget.spec.ts --workers=1 --retries=0 --output setup-budget-test-results --reporter list,json
      - name: Retain focused organization screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-budget-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/setup-budget-test-results/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Retain setup budget evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-budget-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/setup-budget-test-results/
            apps/desktop/setup-budget-report/
            setup-budget-source.json
          retention-days: 7
          if-no-files-found: warn


  setup-budget-backend:
    name: Reviewed setup budget backend (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 977d301696b86ab2882ee04a5b56ad53c63bbd3d
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "977d301696b86ab2882ee04a5b56ad53c63bbd3d"
          test "$(git rev-parse HEAD^{tree})" = "8bbc5863e8a415653aac42744f0c957aa10ffc73"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify setup policy and retained allowance contracts
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_team_budget.py tests/eidolon_cli/test_organization_setup_budget_compatibility.py tests/eidolon_cli/test_organization_team_setup.py tests/eidolon_cli/test_organization_team_generation.py tests/eidolon_cli/test_organization_team_admission.py tests/tui_gateway/test_organization_team_setup.py tests/eidolon_cli/test_organization_owner_policy.py
      - name: Lint reviewed Python paths
        run: .venv/bin/ruff check eidolon_cli/organization_owner_policy_config.py eidolon_cli/organization_team_budget.py eidolon_cli/organization_team_admission.py eidolon_cli/organization_team_setup.py tui_gateway/methods_organization_team_setup.py tests/eidolon_cli/test_organization_team_budget.py tests/eidolon_cli/test_organization_setup_budget_compatibility.py tests/eidolon_cli/test_organization_team_admission.py tests/tui_gateway/test_organization_team_setup.py
