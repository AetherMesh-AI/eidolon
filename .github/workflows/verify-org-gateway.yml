name: Organization gateway verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-org-gateway.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install runtime and test tools
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pip install -e '.[slack]' pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 ruff==0.15.10
      - name: Verify gateway lifecycle and restart fencing
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/gateway/test_organization_runtime.py tests/eidolon_cli/test_organization_service.py tests/eidolon_cli/test_organization_completion_budget.py tests/gateway/test_runner_startup_failures.py tests/gateway/test_startup_restart_race.py tests/gateway/test_restart_drain.py tests/gateway/test_restart_after_turn.py tests/gateway/test_scale_to_zero_watcher.py tests/gateway/test_config.py -j 4
      - name: Verify complete organization backend and style
        if: runner.os == 'Linux'
        run: |
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/tools/test_organization_file_read.py tests/gateway/test_scale_to_zero.py tests/gateway/test_scale_to_zero_dashboard_client.py -j 4
          .venv/bin/ruff check eidolon_cli/organization_service.py eidolon_cli/config_defaults.py gateway/organization_runtime.py gateway/run.py gateway/run_shutdown.py tests/gateway/test_organization_runtime.py
          .venv/bin/python scripts/check_compat_pointers.py
