name: Organization visual proof

# Temporary paired evidence run. Remove after the before/after artifacts are reviewed.
on:
  push:
    branches: ['polish/desktop-visual-hierarchy']
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/organization-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-visual-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  capture:
    name: Native Electron visual proof (${{ matrix.revision }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve the identical visual test harness
        run: cp apps/desktop/e2e/organization-visual-polish.spec.ts "$RUNNER_TEMP/organization-visual-polish.spec.ts"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.revision == 'before'
        with:
          ref: 63ffc20b04f761c8514199e83c834eae1daa8b6c
          persist-credentials: false
      - name: Install the identical test harness and record source revision
        run: |
          cp "$RUNNER_TEMP/organization-visual-polish.spec.ts" apps/desktop/e2e/organization-visual-polish.spec.ts
          echo "EIDOLON_VISUAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked runtime and desktop dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          npm ci
      - name: Install Electron system dependencies
        run: sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2
      - name: Build the native desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Capture native read-only evidence
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test e2e/organization-visual-polish.spec.ts --workers=1 --retries=0
      - name: Retain paired native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-visual-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: error
