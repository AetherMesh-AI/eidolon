name: Organization semantic trial probe
on:
  push:
    branches: [probe/org-semantic-*]
permissions:
  contents: read
concurrency:
  group: organization-semantic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  semantic-trials:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install declared test dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - name: Install supported official sandbox runtime
        run: bash .github/scripts/install-probe-bwrap.sh
      - name: No-provider native preflight
        run: .venv/bin/python scripts/eval_organization_project.py --preflight --report preflight.json
      - name: Organization, pricing, oracle and recovery tests
        run: scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/tools/test_organization_file_read.py tests/scripts/test_organization_trial*.py -j 4
      - name: Existing synthetic smoke compatibility
        run: .venv/bin/python scripts/eval_organization_project.py --report smoke.json
      - name: Synthetic earliest-retention trial
        run: .venv/bin/python scripts/eval_organization_semantics.py --scenario duplicate_retention --retention earliest --output-dir semantic/earliest
      - name: Synthetic latest-retention counterfactual
        run: .venv/bin/python scripts/eval_organization_semantics.py --scenario duplicate_retention --retention latest --output-dir semantic/latest
      - name: Synthetic failed-test recovery trial
        run: .venv/bin/python scripts/eval_organization_semantics.py --scenario signed_bucket --output-dir semantic/repair
      - name: Retain screened trial evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-semantic-evidence
          path: |
            preflight.json
            smoke.json
            semantic/*/report.json
            semantic/*/evidence/
          include-hidden-files: false
          if-no-files-found: warn
