name: Organization first-use setup verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-org-setup.yml']
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install declared runtime and pinned test tools
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -e . pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 ruff==0.15.10
      - name: Verify configuration-only setup on native hosts
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization_setup.py tests/eidolon_cli/test_organization_subscription.py tests/tui_gateway/test_organization_setup.py tests/tui_gateway/test_organization.py -j 3
      - name: Verify complete organization backend on Linux
        if: runner.os == 'Linux'
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/gateway/test_organization_runtime.py tests/tools/test_organization_file_read.py -j 4
          .venv/bin/ruff check eidolon_cli/organization*.py tests/eidolon_cli/test_organization_setup.py tests/tui_gateway/test_organization_setup.py tui_gateway/methods_organization.py
          .venv/bin/python scripts/check_compat_pointers.py
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked desktop and runtime dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Verify organization components and types
        working-directory: apps/desktop
        run: |
          npx vitest run src/app/eidolon src/store/organization-work.test.ts src/app/contrib/organization-shell.test.tsx e2e/organization-project-selection-config.unit.test.ts
          npm run typecheck
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify native setup and existing owner flows
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test e2e/organization-setup.spec.ts e2e/organization-completion-loop.spec.ts e2e/organization-owner-loop.spec.ts --workers=1
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-setup-native-evidence
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
