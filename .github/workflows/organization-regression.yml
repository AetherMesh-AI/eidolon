    # Preserve the existing required check; neither shard may fail, skip or cancel.
    name: Organization native scenarios (Linux)
    needs: desktop-native-suite
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every native scenario shard
        env:
          NATIVE_RESULT: ${{ needs.desktop-native-suite.result }}
        run: test "$NATIVE_RESULT" = success

  directory-acceptance:
    name: Organization directory acceptance (Linux)
    runs-on: ubuntu-22.04
    # Independent build keeps these unchanged checks outside the standard suite's job cap.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Install Electron system dependencies
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
          fc-match --format='%{family}\n' ':lang=ja'
      - name: Build desktop
        id: desktop-build
        working-directory: apps/desktop
        run: npm run build
      - name: Verify gated directory confirmation in an explicit acceptance build
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: directory-report/results.json
        run: |
          npx vite build --mode organization-directory-acceptance --emptyOutDir false
          EIDOLON_DIRECTORY_RECOVERY_ACCEPTANCE=1 xvfb-run -a npx playwright test e2e/directory-selection.spec.ts e2e/organization-owner-accepted-return.spec.ts e2e/organization-switch-intent.spec.ts --grep 'confirms actual directory|recovers durably accepted owner|returns an uncertain intake' --workers=1 --retries=0 --output directory-test-results --reporter list,json
      - name: Retain directory acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-directory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/directory-test-results/
            apps/desktop/directory-report/
          retention-days: 7
          if-no-files-found: warn

  owner-policy-acceptance:
    name: Organization owner policy acceptance (Linux)
    runs-on: ubuntu-22.04
    # Real owner edits and visual evidence remain independently required.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Install Electron system dependencies
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
          fc-match --format='%{family}\n' ':lang=ja'
      - name: Build desktop
        id: desktop-build
        working-directory: apps/desktop
        run: npm run build
      - name: Verify actual owner policy previews, writes and recovery
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: owner-policy-report/results.json
        run: xvfb-run -a npx playwright test e2e/owner-policy-editor.spec.ts e2e/owner-policy-shared-allowance.spec.ts e2e/organization-team-onboarding.spec.ts --workers=1 --retries=0 --output owner-policy-test-results --reporter list,json
      - name: Retain focused first-run screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-first-run-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/owner-policy-test-results/organization-team-*/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Retain owner policy acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-owner-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/owner-policy-test-results/
            apps/desktop/owner-policy-report/
          retention-days: 7
          if-no-files-found: warn

  desktop:
    # Preserve the existing required check name and fail it if any native gate fails or is cancelled.
    name: Organization desktop and native smoke (Linux)
    needs: [desktop-native, directory-acceptance, owner-policy-acceptance, subscription-native-macos]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require standard, directory, owner policy and subscription native acceptance
        env:
          STANDARD_RESULT: ${{ needs.desktop-native.result }}
          DIRECTORY_RESULT: ${{ needs.directory-acceptance.result }}
          OWNER_POLICY_RESULT: ${{ needs.owner-policy-acceptance.result }}
          SUBSCRIPTION_RESULT: ${{ needs.subscription-native-macos.result }}
        run: test "$STANDARD_RESULT" = success && test "$DIRECTORY_RESULT" = success && test "$OWNER_POLICY_RESULT" = success && test "$SUBSCRIPTION_RESULT" = success

  workspace-gallery:
    name: Workspace gallery (${{ matrix.group }}, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [secondary, settings, responsive, read-recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Install Electron system dependencies
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
          fc-match --format='%{family}\n' ':lang=ja'
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify page composition, recovery, zoom and keyboard access
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
          GALLERY_GROUP: ${{ matrix.group }}
        run: |
          case "$GALLERY_GROUP" in
            secondary|settings|responsive)
              specs=("e2e/workspace-${GALLERY_GROUP}-gallery.spec.ts") ;;
            read-recovery)
              specs=(e2e/settings-read-recovery.spec.ts e2e/session-artifact-recovery.spec.ts) ;;
            *) echo "Unknown gallery group: $GALLERY_GROUP" >&2; exit 1 ;;
          esac
          xvfb-run -a npx playwright test "${specs[@]}" --workers=1 --retries=0
      - name: Retain compact English gallery and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-gallery-${{ matrix.group }}-screenshots-en-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/**/*-en-*.png
            apps/desktop/test-results/**/model-recovery-*.png
            apps/desktop/test-results/**/session-files-*.png
            apps/desktop/test-results/**/*evidence.json
            apps/desktop/test-results/**/session-artifact-native-boundary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain workspace gallery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-gallery-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: warn

