name: Organization regression

# Keep this independent of the inherited CI gate and its larger-runner requirements.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/run_tests*'
      - 'scripts/ci/organization-*'
      - '.github/workflows/organization-regression.yml'
      - 'docs/organization-ci.md'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/run_tests*'
      - 'scripts/ci/organization-*'
      - '.github/workflows/organization-regression.yml'
      - 'docs/organization-ci.md'
  workflow_dispatch:
    inputs:
      full_desktop_suite:
        description: Also run the complete desktop unit suite after native verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: organization-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  backend:
    name: Organization backend and migrations (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev --extra slack
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Verify backend, RPC, gateway, tool and migration contracts
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/eidolon_cli/test_profile_owned_codex.py tests/eidolon_cli/test_managed_install_shapes.py tests/eidolon_cli/test_subscription_native_diagnostics.py tests/eidolon_cli/test_subscription_native_recovery_faults.py tests/eidolon_cli/test_subscription_native_lifecycle.py tests/tui_gateway/test_subscription_native_journey.py tests/tui_gateway/test_organization*.py tests/gateway/test_organization*.py tests/tools/test_organization*.py tests/scripts/test_organization*.py tests/agent/test_org_skill_namespace.py tests/agent/test_bounded_context.py tests/agent/test_improve_oneshot.py tests/tui_gateway/test_improve_oneshot.py -j 4
          .venv/bin/ruff check eidolon_cli/organization*.py tui_gateway/methods_organization*.py
          .venv/bin/python scripts/check_compat_pointers.py
      - name: Verify profile export and consistent recovery backups
        run: |
          scripts/run_tests.sh tests/eidolon_cli/test_backup*.py \
            tests/eidolon_cli/test_profile_export*.py tests/eidolon_cli/test_profiles.py -j 4
      - name: Verify shared config primitives and gateway import compatibility
        run: |
          scripts/run_tests.sh tests/eidolon_cli/test_config*.py \
            tests/eidolon_cli/test_env_loader.py tests/eidolon_cli/test_env_export*.py \
            tests/eidolon_cli/test_env_load_cache.py tests/eidolon_cli/test_managed_scope*.py \
            tests/agent/test_secret_scope*.py tests/gateway/test_config*.py \
            tests/gateway/test_delivery*.py tests/gateway/test_dead_targets.py \
            tests/gateway/test_session*.py tests/gateway/test_restart*.py tests/gateway/test_shutdown*.py -j 4

      - name: Verify updater process isolation
        run: |
          scripts/run_tests.sh -j 2 tests/test_update_gateway_install_isolation.py tests/test_update_gateway_signal_identity.py tests/test_update_gateway_coexistence_live.py tests/test_update_gateway_service_authority.py
      # Keep legacy proof input outside the tested checkout's mutable Git state.
      # This sparse checkout supplies one module as data, never the Python runtime.
      - name: Check out immutable first-upgrade selector fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AetherMesh-AI/eidolon
          ref: c00c29cf4e071e5844eeda20b2719bcfd31aa2c3
          path: .ci-fixtures/pre-isolation
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: eidolon_cli/update_cmd_fleet.py
          sparse-checkout-cone-mode: false
      - name: Verify first-upgrade selector with current runtime
        run: |
          fixture="$GITHUB_WORKSPACE/.ci-fixtures/pre-isolation"
          test -d "$fixture/.git"
          test "$(git -C "$fixture" rev-parse HEAD)" = c00c29cf4e071e5844eeda20b2719bcfd31aa2c3
          git -C "$fixture" show HEAD:eidolon_cli/update_cmd_fleet.py > "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py"
          test "$(git hash-object "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py")" = a6eeb39fe0641bfc1849b75fda5a6053fb3115c8
          HERMES_HOME="$(mktemp -d)" PYTHONPATH="$PWD" .venv/bin/python scripts/ci/prove_gateway_legacy_selector.py "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py"

  native-core:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suite: all
            label: Organization core (macos-latest)
          - os: windows-latest
            suite: ledger-identity
            label: Organization core (windows-latest) - ledger and identity
          - os: windows-latest
            suite: outcomes-attention
            label: Organization core (windows-latest) - outcomes and attention
          - os: windows-latest
            suite: projects-config
            label: Organization core (windows-latest) - projects and configuration
          - os: windows-latest
            suite: leadership-staffing
            label: Organization core (windows-latest) - leadership and staffing
          - os: windows-latest
            suite: work-packages
            label: Organization core (windows-latest) - work packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify host-native ledger, recovery and unsupported execution guards
        run: |
          ledger_identity_tests=(
            tests/eidolon_cli/test_organization_setup_subscription_filesystem.py
            tests/eidolon_cli/test_organization_setup_subscription_reconciliation.py
            tests/eidolon_cli/test_subscription_native_diagnostics.py
            tests/eidolon_cli/test_subscription_native_recovery_faults.py
            tests/eidolon_cli/test_subscription_native_lifecycle.py
            tests/tui_gateway/test_subscription_native_journey.py
            tests/eidolon_cli/test_organization_store.py
            tests/eidolon_cli/test_organization_schema_initialization.py
            tests/eidolon_cli/test_organization_budget_migration.py
            tests/eidolon_cli/test_organization_completion_reserve.py
            tests/eidolon_cli/test_organization_completion_reserve_policy.py
            tests/eidolon_cli/test_organization_completion_reserve_e2e.py
            tests/eidolon_cli/test_organization_pacing.py
            tests/eidolon_cli/test_organization_pacing_runtime.py
            tests/eidolon_cli/test_organization_pacing_cli.py
            tests/eidolon_cli/test_organization_model_routing.py
            tests/eidolon_cli/test_organization_model_routing_e2e.py
            tests/eidolon_cli/test_organization_routing_observations.py
            tests/eidolon_cli/test_organization_route_benchmarks.py
            tests/eidolon_cli/test_organization_owner_policy.py
            tests/eidolon_cli/test_organization_sqlite_diagnostics.py
            tests/eidolon_cli/test_organization_ledger_writer.py
            tests/eidolon_cli/test_organization_store_readonly_connections.py
            tests/eidolon_cli/test_organization_subscription_send_coordination.py
            tests/eidolon_cli/test_organization_team_setup.py
            tests/eidolon_cli/test_organization_team_contention.py
            tests/eidolon_cli/test_organization_team_admission.py
            tests/eidolon_cli/test_organization_team_generation.py
            tests/tui_gateway/test_organization_team_setup.py
            tests/eidolon_cli/test_organization_shared_allowance.py
            tests/eidolon_cli/test_organization_shared_allowance_cli.py
            tests/eidolon_cli/test_organization_shared_budget.py
            tests/eidolon_cli/test_organization_shared_runtime.py
            tests/eidolon_cli/test_organization_shared_contention.py
            tests/tui_gateway/test_organization_shared_allowance.py
            tests/tui_gateway/test_organization_owner_policy.py
            tests/agent/test_bounded_context.py
            tests/eidolon_cli/test_organization_artifact_retention.py
            tests/eidolon_cli/test_organization_identity.py
            tests/eidolon_cli/test_organization_metadata.py
            tests/eidolon_cli/test_organization_metadata_read.py
            tests/eidolon_cli/test_organization_phases.py
            tests/eidolon_cli/test_organization_observation.py
            tests/tui_gateway/test_organization_observation.py
            tests/tui_gateway/test_organization_metadata.py
            tests/eidolon_cli/test_organization_identity_memory.py
            tests/eidolon_cli/test_organization_identity_assignments.py
            tests/eidolon_cli/test_organization_history.py
            tests/eidolon_cli/test_organization_cross_feature_recovery.py
            tests/eidolon_cli/test_organization_request_recovery.py
            tests/eidolon_cli/test_organization_selective_recovery.py
            tests/eidolon_cli/test_organization_replacement.py
            tests/eidolon_cli/test_organization_tool_receipts.py
          )
          outcomes_attention_tests=(
            tests/eidolon_cli/test_organization_attention.py
            tests/eidolon_cli/test_organization_outcomes.py
            tests/eidolon_cli/test_organization_outcomes_revisions.py
            tests/eidolon_cli/test_organization_outcomes_pagination.py
            tests/eidolon_cli/test_organization_outcomes_validation.py
            tests/gateway/test_organization_policy_reload.py
            tests/tui_gateway/test_organization_outcomes.py
          )
          projects_config_tests=(
            tests/eidolon_cli/test_isolated_provider_inventory.py
            tests/eidolon_cli/test_isolated_provider_presentation.py
            tests/eidolon_cli/test_organization_workspaces.py
            tests/eidolon_cli/test_profile_owned_codex.py
            tests/eidolon_cli/test_organization_profile_codex.py
            tests/eidolon_cli/test_organization_codex_budget_contract.py
            tests/eidolon_cli/test_organization_reuse_contract_evidence.py
            tests/eidolon_cli/test_organization_isolated_admission.py
            tests/eidolon_cli/test_organization_isolated_project_e2e.py
            tests/tui_gateway/test_organization_workspaces.py
            tests/eidolon_cli/test_organization_project_registry.py
            tests/eidolon_cli/test_organization_milestones.py
            tests/eidolon_cli/test_organization_goal_allowances.py
            tests/eidolon_cli/test_organization_goal_continuation.py
            tests/eidolon_cli/test_organization_goal_reauthorization.py
            tests/tui_gateway/test_organization_milestones.py
            tests/tui_gateway/test_organization_goals.py
            tests/eidolon_cli/test_organization_project_registry_processes.py
            tests/eidolon_cli/test_organization_project_registry_conflicts.py
            tests/eidolon_cli/test_organization_project_registry_links.py
            tests/eidolon_cli/test_organization_project_portability.py
            tests/eidolon_cli/test_organization_multi_project_execution.py
            tests/eidolon_cli/test_organization_inspection_acceptance.py
            tests/eidolon_cli/test_organization_project_execution_e2e.py
            tests/eidolon_cli/test_managed_install_shapes.py
            tests/gateway/test_organization_config_serialization.py
            tests/tui_gateway/test_organization_project_setup.py
          )
          leadership_staffing_tests=(
            tests/eidolon_cli/test_organization_question_routing.py
            tests/eidolon_cli/test_organization_question_wire.py
            tests/eidolon_cli/test_organization_owner_chat*.py
            tests/tui_gateway/test_organization_owner_chat*.py
            tests/eidolon_cli/test_organization_conversations.py
            tests/eidolon_cli/test_organization_conversation_security.py
            tests/eidolon_cli/test_organization_conversation_runtime.py
            tests/eidolon_cli/test_organization_conversation_wire.py
            tests/eidolon_cli/test_organization_management_configuration.py
            tests/eidolon_cli/test_organization_management_staffing.py
            tests/eidolon_cli/test_organization_management_transfers.py
            tests/eidolon_cli/test_organization_management_leadership.py
            tests/eidolon_cli/test_organization_leadership_handoffs_planning.py
            tests/eidolon_cli/test_organization_leadership_handoffs_integration.py
            tests/eidolon_cli/test_organization_leadership_handoffs_acceptance.py
            tests/eidolon_cli/test_organization_leadership_handoffs_work.py
            tests/eidolon_cli/test_organization_leadership_handoff_validation.py
            tests/eidolon_cli/test_organization_leadership_handoff_continuation.py
            tests/eidolon_cli/test_organization_paused_handoffs.py
            tests/eidolon_cli/test_organization_leadership_routes_owner.py
            tests/eidolon_cli/test_organization_leadership_routes_agent.py
            tests/eidolon_cli/test_organization_leadership_routes_rollback.py
            tests/eidolon_cli/test_organization_persistent_leadership.py
          )
          work_package_tests=(
            tests/eidolon_cli/test_organization_work_packages.py
            tests/eidolon_cli/test_organization_work_packages_e2e.py
            tests/eidolon_cli/test_organization_package_handoffs_routes.py
            tests/eidolon_cli/test_organization_package_handoffs_transfers.py
            tests/eidolon_cli/test_organization_package_handoffs_obligations.py
            tests/eidolon_cli/test_organization_package_handoffs_validation.py
            tests/eidolon_cli/test_organization_package_evidence.py
          )
          case '${{ matrix.suite }}' in
            all) native_tests=("${ledger_identity_tests[@]}" "${outcomes_attention_tests[@]}" "${projects_config_tests[@]}" "${leadership_staffing_tests[@]}" "${work_package_tests[@]}") ;;
            ledger-identity) native_tests=("${ledger_identity_tests[@]}") ;;
            outcomes-attention) native_tests=("${outcomes_attention_tests[@]}") ;;
            projects-config) native_tests=("${projects_config_tests[@]}") ;;
            leadership-staffing) native_tests=("${leadership_staffing_tests[@]}") ;;
            work-packages) native_tests=("${work_package_tests[@]}") ;;
            *) echo 'Unknown native suite' >&2; exit 1 ;;
          esac
          diagnostic_args=()
          file_budget_args=()
          if [[ '${{ matrix.os }}' == 'windows-latest' && ( '${{ matrix.suite }}' == 'outcomes-attention' || '${{ matrix.suite }}' == 'ledger-identity' ) ]]; then
            # Retain every assertion. Phase timings and
            # live stacks distinguish slow setup from a blocked test operation.
            diagnostic_args=(-vv -s -p scripts.ci.organization_timing --organization-timing-dir=organization-timing -o faulthandler_timeout=30)
          fi
          if [[ '${{ matrix.os }}' == 'windows-latest' ]]; then
            # 108 real task lifecycles: retained run 38803777266 made continuous
            # progress but spent 218s in close and 58s in commit before 300s.
            # Only this file gets 600s; all others keep 300s and concurrency stays 3.
            file_budget_args=(--file-timeout-override tests/eidolon_cli/test_organization_artifact_retention.py=600)
          fi
          scripts/run_tests.sh "${native_tests[@]}" -j 3 "${file_budget_args[@]}" -- "${diagnostic_args[@]}"

      - name: Verify native updater process isolation
        if: matrix.os == 'macos-latest'
        run: |
          scripts/run_tests.sh -j 2 tests/test_update_gateway_install_isolation.py tests/test_update_gateway_signal_identity.py tests/test_update_gateway_coexistence_live.py tests/test_update_gateway_service_authority.py
      # Keep legacy proof input outside the tested checkout's mutable Git state.
      # This sparse checkout supplies one module as data, never the Python runtime.
      - name: Check out immutable first-upgrade selector fixture
        if: matrix.os == 'macos-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AetherMesh-AI/eidolon
          ref: c00c29cf4e071e5844eeda20b2719bcfd31aa2c3
          path: .ci-fixtures/pre-isolation
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: eidolon_cli/update_cmd_fleet.py
          sparse-checkout-cone-mode: false
      - name: Verify first-upgrade selector with current runtime
        if: matrix.os == 'macos-latest'
        run: |
          fixture="$GITHUB_WORKSPACE/.ci-fixtures/pre-isolation"
          test -d "$fixture/.git"
          test "$(git -C "$fixture" rev-parse HEAD)" = c00c29cf4e071e5844eeda20b2719bcfd31aa2c3
          git -C "$fixture" show HEAD:eidolon_cli/update_cmd_fleet.py > "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py"
          test "$(git hash-object "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py")" = a6eeb39fe0641bfc1849b75fda5a6053fb3115c8
          HERMES_HOME="$(mktemp -d)" PYTHONPATH="$PWD" .venv/bin/python scripts/ci/prove_gateway_legacy_selector.py "$RUNNER_TEMP/eidolon-pre-isolation-fleet.py"

      - name: Retain Windows ledger and attention phase timings
        if: ${{ always() && matrix.os == 'windows-latest' && (matrix.suite == 'outcomes-attention' || matrix.suite == 'ledger-identity') }}
        run: |
          .venv/Scripts/python.exe -m scripts.ci.organization_timing organization-timing

      - name: Retain sanitized Windows diagnostic files
        if: ${{ always() && matrix.os == 'windows-latest' && (matrix.suite == 'outcomes-attention' || matrix.suite == 'ledger-identity') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-diagnostics-${{ matrix.suite }}
          path: organization-timing/sanitized/
          if-no-files-found: error
          retention-days: 7

  native-windows:
    # Retain the existing check name. This gate cannot succeed if a native
    # matrix entry fails, is cancelled or is skipped.
    name: Organization core (windows-latest)
    needs: native-core
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every native shard
        env:
          NATIVE_RESULT: ${{ needs.native-core.result }}
        run: test "$NATIVE_RESULT" = success

  # Native display strategy: use the real hosted macOS session. A missing display
  # fails verification; never substitute a synthetic success or a host override.
  subscription-native-macos:
    name: Organization subscription native journey (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      SUBSCRIPTION_PROOF_SHA: ${{ github.sha }}
      EIDOLON_OLD_RUNTIME_PATH: ${{ github.workspace }}/old-runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          path: old-runtime
          persist-credentials: false
      - name: Verify exact event source, old runtime and actual macOS host
        run: |
          set -euo pipefail
          mkdir -p subscription-native-proof
          test "$(git rev-parse HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git -C ../old-runtime rev-parse HEAD)" = 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          test "$(git -C ../old-runtime rev-parse 'HEAD^{tree}')" = 719349cb69ed9fb7bbc2e6aeabb1ffabc8e08e3b
          test "$(uname -s)" = Darwin
          test -x /usr/bin/sandbox-exec
          git rev-parse HEAD 'HEAD^{tree}' HEAD:apps/desktop/src HEAD:apps/desktop/e2e > subscription-native-proof/source.txt
          git show -s --format=%P HEAD > subscription-native-proof/parents.txt
          {
            sw_vers
            uname -a
            printf 'ImageOS=%s\nImageVersion=%s\nRunnerOS=%s\nRunnerArch=%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUNNER_OS:-}" "${RUNNER_ARCH:-}"
          } | tee subscription-native-proof/host.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
          npm ci
          node --version > subscription-native-proof/node-version.txt
          .venv/bin/python --version > subscription-native-proof/python-version.txt
          printf 'HERMES_PYTHON=%s/.venv/bin/python\n' "$PWD" >> "$GITHUB_ENV"
