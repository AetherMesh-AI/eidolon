name: Organization regression

# Keep this independent of the inherited CI gate and its larger-runner requirements.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/run_tests*'
      - 'scripts/ci/organization-*'
      - '.github/workflows/organization-regression.yml'
      - 'docs/organization-ci.md'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/run_tests*'
      - 'scripts/ci/organization-*'
      - '.github/workflows/organization-regression.yml'
      - 'docs/organization-ci.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  backend:
    name: Organization backend and migrations (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Verify backend, RPC, gateway, tool and migration contracts
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/gateway/test_organization*.py tests/tools/test_organization*.py tests/scripts/test_organization*.py tests/agent/test_org_skill_namespace.py -j 4
          .venv/bin/ruff check eidolon_cli/organization*.py tui_gateway/methods_organization.py
          .venv/bin/python scripts/check_compat_pointers.py

  native-core:
    name: Organization core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0
      - name: Verify host-native ledger, recovery and unsupported execution guards
        run: |
          scripts/run_tests.sh \
            tests/eidolon_cli/test_organization_store.py \
            tests/eidolon_cli/test_organization_identity.py \
            tests/eidolon_cli/test_organization_history.py \
            tests/eidolon_cli/test_organization_attention.py \
            tests/eidolon_cli/test_organization_outcomes.py \
            tests/eidolon_cli/test_organization_cross_feature_recovery.py \
            tests/eidolon_cli/test_organization_tool_receipts.py \
            tests/eidolon_cli/test_organization_multi_project_execution.py \
            tests/eidolon_cli/test_organization_inspection_acceptance.py \
            tests/eidolon_cli/test_organization_project_execution_e2e.py \
            tests/gateway/test_organization_policy_reload.py \
            tests/tui_gateway/test_organization_outcomes.py -j 3

  desktop:
    name: Organization desktop and native smoke (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Verify components, fixture helpers and types before native work
        working-directory: apps/desktop
        run: |
          npx vitest run src/app/eidolon src/store/organization-work.test.ts src/app/contrib/organization-shell.test.tsx e2e/organization-*.unit.test.ts
          npm run typecheck
      - name: Install required native project isolation
        run: bash scripts/ci/organization-sandbox.sh
      - name: Install Electron system dependencies
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify synthetic owner, setup, attention, multi-repository and outcome flows
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: xvfb-run -a npx playwright test e2e/organization-*.spec.ts --workers=1 --retries=0
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: warn
