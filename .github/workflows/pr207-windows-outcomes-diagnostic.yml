name: PR207 Windows outcomes diagnostic

on:
  push:
    branches: [proof/pr207-windows-outcomes-20261019]

permissions:
  contents: read

jobs:
  compare:
    name: Windows outcomes diagnostic (${{ matrix.arm }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [original-native-timer, python-watchdog-only]
    defaults:
      run:
        shell: bash
    env:
      CI: true
      HERMES_TEST_FILE_RETRIES: '0'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - name: Check out reviewed diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostics
          persist-credentials: false
      - name: Check out immutable failing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e03cfec410a280f8907277009a023376edf73664
          path: subject
          persist-credentials: false
      - name: Require exact source and source tree
        run: |
          test "$(git -C subject rev-parse HEAD)" = e03cfec410a280f8907277009a023376edf73664
          test "$(git -C subject rev-parse 'HEAD^{tree}')" = cfdda332108dbcb303ab65bb6885be99eb4e9826
          test -z "$(git -C subject status --porcelain --untracked-files=no)"
      - name: Set up the observed Windows Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the same locked test dependencies
        working-directory: subject
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12.10 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Prepare external canonical launcher and source receipts
        run: |
          subject/.venv/Scripts/python.exe diagnostics/scripts/ci/pr207_windows_outcomes_diagnostic.py prepare \
            --subject "$GITHUB_WORKSPACE/subject" \
            --evidence "$GITHUB_WORKSPACE/evidence/${{ matrix.arm }}" \
            --arm '${{ matrix.arm }}' \
            --launcher "$RUNNER_TEMP/pr207-${{ matrix.arm }}.sh"
      - name: Compare one original lane with one diagnostic-timer-isolation lane
        # Both arms retain all seven files, j3, zero retries, every assertion,
        # the 300s file cap and the existing Python-thread stack collector.
        # Only the second arm omits CPython's native scheduled stack dump.
        # faulthandler_timeout is a dump timer, not a test failure budget.
        run: bash "$RUNNER_TEMP/pr207-${{ matrix.arm }}.sh"
      - name: Sanitize existing per-phase and stack evidence
        if: always()
        working-directory: subject
        run: |
          .venv/Scripts/python.exe scripts/ci/organization_timing.py "$GITHUB_WORKSPACE/evidence/${{ matrix.arm }}/timing"
      - name: Require unchanged tracked source after the experiment
        if: always()
        run: |
          test "$(git -C subject rev-parse HEAD)" = e03cfec410a280f8907277009a023376edf73664
          test "$(git -C subject rev-parse 'HEAD^{tree}')" = cfdda332108dbcb303ab65bb6885be99eb4e9826
          test -z "$(git -C subject status --porcelain --untracked-files=no)"
      - name: Retain diagnostic receipts and sanitized logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr207-windows-outcomes-${{ matrix.arm }}
          path: |
            evidence/${{ matrix.arm }}/*.json
            evidence/${{ matrix.arm }}/*.jsonl
            evidence/${{ matrix.arm }}/pytest-output/
            evidence/${{ matrix.arm }}/timing/sanitized/
          if-no-files-found: error
          retention-days: 7
