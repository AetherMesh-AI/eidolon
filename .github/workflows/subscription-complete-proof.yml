name: Subscription complete vertical diagnostic
on:
  push:
    branches: [temp/subscription-setup-complete-proof]
permissions:
  contents: read
concurrency:
  group: subscription-backend-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  EIDOLON_OLD_RUNTIME_PATH: ${{ github.workspace }}/old-runtime
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  proof:
    name: Subscription backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9fd9ae86b119436fe667220059f16797f007ade1
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          path: old-runtime
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact source and old runtime
        run: |
          test "$(git rev-parse HEAD)" = 9fd9ae86b119436fe667220059f16797f007ade1
          test "$(git rev-parse HEAD^{tree})" = ada86ed2de9a76e283d759ff79a4b8bcfc600f7b
          test "$(git -C ../old-runtime rev-parse HEAD)" = 43a84a77f094084ce8eb8dc2e99fdd679fb9d065
          test "$(git -C ../old-runtime rev-parse HEAD^{tree})" = 719349cb69ed9fb7bbc2e6aeabb1ffabc8e08e3b
          python -c "import platform; print(platform.system(), platform.machine())"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Canonical synthetic vertical and API regressions
        run: |
          set -o pipefail
          scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_setup_subscription_http.py tests/eidolon_cli/test_organization_setup_subscription_catalog.py tests/eidolon_cli/test_organization_setup_subscription_refresh.py tests/eidolon_cli/test_organization_setup_subscription_revocation.py tests/eidolon_cli/test_organization_setup_subscription_auth.py tests/eidolon_cli/test_organization_setup_subscription_policy.py tests/eidolon_cli/test_organization_setup_subscription_policy_integration.py tests/eidolon_cli/test_organization_setup_subscription_transport.py tests/eidolon_cli/test_organization_setup_subscription_usage.py tests/eidolon_cli/test_organization_setup_subscription_admission.py tests/eidolon_cli/test_organization_team_subscription_generation.py tests/eidolon_cli/test_organization_team_admission.py tests/eidolon_cli/test_organization_team_budget.py tests/eidolon_cli/test_organization_team_generation.py tests/eidolon_cli/test_organization_team_setup.py tests/eidolon_cli/test_organization_owner_policy.py tests/tui_gateway/test_organization_setup_subscription.py tests/tui_gateway/test_organization_setup_subscription_flow.py tests/tui_gateway/test_organization_setup_subscription_preflight.py tests/eidolon_cli/test_organization_setup_subscription_catalog_passive.py tests/tui_gateway/test_organization_setup_subscription_readiness.py tests/eidolon_cli/test_organization_subscription_races.py tests/tui_gateway/test_subscription_native_journey.py -- -vv -o faulthandler_timeout=30 2>&1 | tee backend-tests.log
      - name: Protected store and host regressions
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_setup_subscription_host.py -k test_windows_production_refuses_before_lock_import 2>&1 | tee -a backend-tests.log
            scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_setup_subscription_store.py -k 'test_production_platforms_fail_closed_without_native_read or test_darwin_acl_boundary_with_synthetic_c_api or nonblocking or attestation' 2>&1 | tee -a backend-tests.log
          else
            scripts/run_tests.sh -j 2 tests/eidolon_cli/test_organization_setup_subscription_store.py tests/eidolon_cli/test_organization_setup_subscription_host.py tests/eidolon_cli/test_setup_subscription_export_security.py 2>&1 | tee -a backend-tests.log
          fi
      - name: Retain bounded test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subscription-backend-${{ matrix.os }}
          path: source/backend-tests.log
          if-no-files-found: ignore
          retention-days: 7

  # Insert this job under jobs: after replacing 9fd9ae86b119436fe667220059f16797f007ade1 and ada86ed2de9a76e283d759ff79a4b8bcfc600f7b with
  # the immutable source commit and its root tree. No workflow/branch publication.
  # Native display strategy: launch Electron directly on the hosted macOS session.
  # https://www.electronjs.org/docs/latest/tutorial/testing-on-headless-ci
  # A display/window/capture preflight must pass; absence is a host failure, never
  # a skipped synthetic success. No Xvfb, virtual-display install, or OS override.
  subscription-native-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      SUBSCRIPTION_PROOF_SHA: '9fd9ae86b119436fe667220059f16797f007ade1'
      SUBSCRIPTION_PROOF_TREE: 'ada86ed2de9a76e283d759ff79a4b8bcfc600f7b'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9fd9ae86b119436fe667220059f16797f007ade1
          persist-credentials: false
      - name: Verify immutable source and actual macOS host
        run: |
          set -euo pipefail
          mkdir -p subscription-native-proof
          test "$(git rev-parse HEAD)" = "$SUBSCRIPTION_PROOF_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SUBSCRIPTION_PROOF_TREE"
          test "$(uname -s)" = Darwin
          test -x /usr/bin/sandbox-exec
          git rev-parse HEAD 'HEAD^{tree}' HEAD:apps/desktop/src HEAD:apps/desktop/e2e > subscription-native-proof/source.txt
          git show -s --format=%P HEAD > subscription-native-proof/parents.txt
          {
            sw_vers
            uname -a
            printf 'ImageOS=%s\nImageVersion=%s\nRunnerOS=%s\nRunnerArch=%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUNNER_OS:-}" "${RUNNER_ARCH:-}"
          } | tee subscription-native-proof/host.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
          npm ci
          node --version > subscription-native-proof/node-version.txt
          .venv/bin/python --version > subscription-native-proof/python-version.txt
          printf 'HERMES_PYTHON=%s/.venv/bin/python\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Verify registered native gateway journey and fail-closed network guards
        run: |
          set -euo pipefail
          scripts/run_tests.sh tests/tui_gateway/test_subscription_native_journey.py -v --tb=short --junitxml="$GITHUB_WORKSPACE/subscription-native-proof/gateway-junit.xml" 2>&1 | tee subscription-native-proof/gateway.log
      - name: Verify subscription and baseline setup components
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npx vitest run src/app/eidolon/team-setup-subscription.test.tsx src/app/eidolon/team-setup-subscription-client.test.ts src/app/eidolon/team-onboarding-subscription.test.tsx src/app/eidolon/team-onboarding.test.tsx src/app/eidolon/team-onboarding-entry.test.tsx src/app/eidolon/team-onboarding-client.test.ts src/app/eidolon/team-setup-budget-editor.test.tsx src/app/eidolon/team-setup-budget-client.test.ts 2>&1 | tee ../../subscription-native-proof/components.log
      - name: Verify desktop types
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../../subscription-native-proof/typecheck.log
      - name: Build desktop
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../../subscription-native-proof/build.log
      - name: Prove a real macOS Electron window is available
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --input-type=module <<'JS' 2>&1 | tee subscription-native-proof/native-display.log
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          import { _electron } from '@playwright/test'
          const require = createRequire(path.resolve('apps/desktop/package.json'))
          assert.equal(process.platform, 'darwin')
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'eidolon-native-display-'))
          fs.writeFileSync(path.join(tmp, 'package.json'), JSON.stringify({ name: 'eidolon-native-display-proof', main: 'main.cjs' }))
          fs.writeFileSync(path.join(tmp, 'main.cjs'), `
            const { app, BrowserWindow, session } = require('electron');
            app.setPath('userData', ${JSON.stringify(path.join(tmp, 'user-data'))});
            app.whenReady().then(() => {
              session.defaultSession.webRequest.onBeforeRequest((details, callback) => callback({ cancel: !/^(data|file|devtools):/.test(details.url) }));
              const window = new BrowserWindow({ width: 640, height: 480, show: true, backgroundColor: '#ffffff' });
              window.loadURL('data:text/html,<h1>Native macOS display proof</h1>');
            });
            app.on('window-all-closed', () => app.quit());
          `)
          let application
          try {
            application = await _electron.launch({ executablePath: require('electron'), args: [tmp], timeout: 30000 })
            const page = await application.firstWindow({ timeout: 30000 })
            await page.getByRole('heading', { name: 'Native macOS display proof' }).waitFor()
            const host = await application.evaluate(({ app, screen, BrowserWindow }) => ({
              platform: process.platform,
              architecture: process.arch,
              electronVersion: process.versions.electron,
              appReady: app.isReady(),
              displays: screen.getAllDisplays().map(display => ({ bounds: display.bounds, scaleFactor: display.scaleFactor })),
              visibleWindows: BrowserWindow.getAllWindows().filter(window => window.isVisible()).length,
            }))
            fs.writeFileSync('subscription-native-proof/native-display.json', JSON.stringify(host, null, 2))
            assert.equal(host.platform, 'darwin')
            assert.equal(host.appReady, true)
            assert.ok(host.displays.some(display => display.bounds.width > 0 && display.bounds.height > 0), 'Hosted macOS session has no usable native display')
            assert.equal(host.visibleWindows, 1)
            const capture = await page.screenshot({ path: 'subscription-native-proof/native-display.png' })
            assert.ok(capture.length > 100)
            console.log(JSON.stringify(host))
          } catch (error) {
            fs.writeFileSync('subscription-native-proof/native-display-failure.txt', String(error))
            throw error
          } finally {
            try { await application?.close() } finally { fs.rmSync(tmp, { recursive: true, force: true }) }
          }
          JS
      - name: Verify native subscription setup and unchanged fresh API route
        timeout-minutes: 25
        working-directory: apps/desktop
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        run: |
          set -euo pipefail
          npx playwright test e2e/subscription-native-journey.spec.ts e2e/organization-fresh-team-setup.spec.ts --workers=1 --retries=0 --global-timeout=1200000 2>&1 | tee ../../subscription-native-proof/playwright.log
      - name: Record source integrity after verification
        if: always()
        run: |
          set -euo pipefail
          mkdir -p subscription-native-proof
          git rev-parse HEAD 'HEAD^{tree}' > subscription-native-proof/final-source.txt
          git status --short > subscription-native-proof/worktree-status.txt
          git diff --exit-code > subscription-native-proof/tracked-diff.txt
      - name: Retain source receipts, native screenshots, traces, and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subscription-native-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            subscription-native-proof/
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: error
  
