name: Durable organization outcomes verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-org-outcomes.yml']
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install declared runtime and pinned test tools
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -e . pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 ruff==0.15.10
      - name: Install verified official sandbox runtime on supported Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential meson ninja-build pkg-config libcap-dev libseccomp2 libselinux1-dev
          build_root="$(mktemp -d)"
          curl --fail --location --retry 2 https://github.com/containers/bubblewrap/releases/download/v0.13.0/bubblewrap-0.13.0.tar.xz -o "$build_root/release.tar.xz"
          echo '4734237473c0e5d695e4e9034a34e43b2dbf5164655bd13fa59ae376b2b7a765  '"$build_root/release.tar.xz" | sha256sum -c -
          tar -xJf "$build_root/release.tar.xz" -C "$build_root"
          meson setup "$build_root/build" "$build_root/bubblewrap-0.13.0" --prefix=/usr -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dtests=false
          meson compile -C "$build_root/build"
          sudo meson install -C "$build_root/build"
          /usr/bin/bwrap --version
      - name: Verify outcome persistence and native ledger lifecycles
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization_outcomes.py tests/eidolon_cli/test_organization_history.py tests/eidolon_cli/test_organization_attention.py tests/tui_gateway/test_organization_outcomes.py -j 3
      - name: Verify complete organization backend on Linux
        if: runner.os == 'Linux'
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/gateway/test_organization_runtime.py tests/tools/test_organization_file_read.py -j 4
          .venv/bin/ruff check eidolon_cli/organization*.py tests/eidolon_cli/test_organization_outcomes.py tests/tui_gateway/test_organization_outcomes.py tui_gateway/methods_organization.py
          .venv/bin/python scripts/check_compat_pointers.py
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked desktop and runtime dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Verify organization components and types
        working-directory: apps/desktop
        run: |
          npx vitest run src/app/eidolon src/store/organization-work.test.ts src/app/contrib/organization-shell.test.tsx e2e/organization-project-selection-config.unit.test.ts
          npm run typecheck
      - name: Install verified official sandbox runtime on supported Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential meson ninja-build pkg-config libcap-dev libseccomp2 libselinux1-dev
          build_root="$(mktemp -d)"
          curl --fail --location --retry 2 https://github.com/containers/bubblewrap/releases/download/v0.13.0/bubblewrap-0.13.0.tar.xz -o "$build_root/release.tar.xz"
          echo '4734237473c0e5d695e4e9034a34e43b2dbf5164655bd13fa59ae376b2b7a765  '"$build_root/release.tar.xz" | sha256sum -c -
          tar -xJf "$build_root/release.tar.xz" -C "$build_root"
          meson setup "$build_root/build" "$build_root/bubblewrap-0.13.0" --prefix=/usr -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dtests=false
          meson compile -C "$build_root/build"
          sudo meson install -C "$build_root/build"
          /usr/bin/bwrap --version
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify native outcome inbox and retained evidence
        env:
          EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test e2e/organization-completion-loop.spec.ts e2e/organization-project-execution.spec.ts e2e/organization-owner-loop.spec.ts --workers=1
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-outcomes-native-evidence
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
