            inventory = {}
            export_error = False
            try:
                assert not raw.is_symlink()
                assert all(p.name in RAW_NAMES or p.name == 'timing' for p in raw.iterdir())
                for name in sorted(RAW_NAMES):
                    path = raw / name
                    if not path.exists():
                        continue
                    content = regular_bytes(path)
                    inventory[name] = {'rawSha256': hashlib.sha256(content).hexdigest(), 'rawBytes': len(content)}
                    text = content.decode('utf-8', errors='replace')
                    if name == 'junit.xml':
                        xml = ET.fromstring(text)
                        for element in xml.iter():
                            for key in tuple(element.attrib):
                                element.set(key, '[HOST]' if key == 'hostname' else '[REDACTED_VALUE]' if sensitive_key(key) else sanitize(element.get(key), roots))
                            if element.text:
                                element.text = sanitize(element.text, roots)
                            if element.tail:
                                element.tail = sanitize(element.tail, roots)
                        text = ET.tostring(xml, encoding='unicode')
                    elif name.endswith('.json'):
                        text = json.dumps(sanitize_value(json.loads(text), roots), indent=2) + '\n'
                    elif name.endswith('.jsonl'):
                        text = ''.join(json.dumps(sanitize_value(json.loads(line), roots)) + '\n' for line in text.splitlines())
                    else:
                        text = sanitize(text, roots)
                    (out / name).write_text(text, encoding='utf-8')
                assert (raw / 'timing').is_dir() and not (raw / 'timing').is_symlink()
                timing_files = sorted((raw / 'timing').glob('organization-timing-*.jsonl'))
                stack_files = sorted((raw / 'timing').glob('organization-stacks-*.txt'))
                assert len(timing_files) == len(stack_files) == 1
                assert set((raw / 'timing').iterdir()) == set(timing_files + stack_files)
                assert timing_files[0].stem.replace('timing', 'stacks') == stack_files[0].stem
                for path in timing_files + stack_files:
                    content = regular_bytes(path)
                    inventory[path.name] = {'rawSha256': hashlib.sha256(content).hexdigest(), 'rawBytes': len(content)}
                    text = content.decode('utf-8', errors='replace')
                    if path.suffix == '.txt':
                        text = re.sub(r'File "([^"\n]+)"', lambda m: 'File "' + re.split(r'[/\\]', m[1])[-1] + '"', text)
                    if path.suffix == '.jsonl':
                        text = ''.join(json.dumps(sanitize_value(json.loads(line), roots)) + '\n' for line in text.splitlines())
                    else:
                        text = sanitize(text, roots)
                    (out / path.name).write_text(text, encoding='utf-8')
                assert all((raw / name).is_file() for name in RAW_NAMES)
                assert (raw / 'pytest-full.log').stat().st_size > 0 and (raw / 'canonical.log').stat().st_size > 0
                data = {name: load_json(raw / name) for name in RAW_NAMES if name.endswith('.json')}
                data['reports.jsonl'] = [json.loads(line) for line in (raw / 'reports.jsonl').read_text(encoding='utf-8').splitlines()]
                timings = [json.loads(line) for line in timing_files[0].read_text(encoding='utf-8').splitlines()]
                proof = validate_payload(data, ET.parse(raw / 'junit.xml').getroot(), timings, expected_capture_sha)
            except Exception as exc:
                proof['errorCategory'] = type(exc).__name__ if type(exc).__name__ in {
                    'AssertionError', 'FileNotFoundError', 'PermissionError', 'ValueError', 'KeyError',
                    'JSONDecodeError', 'ParseError', 'UnicodeDecodeError'} else 'EvidenceError'
                export_error = True
            write(out / 'evidence-proof.json', proof)
            write(out / 'raw-byte-receipts.json', inventory)
            manifest = {p.name: {'sha256': digest(p), 'bytes': p.stat().st_size}
                        for p in sorted(out.iterdir()) if p.is_file() and not p.is_symlink()}
            write(out / 'sanitized-manifest.json', manifest)
