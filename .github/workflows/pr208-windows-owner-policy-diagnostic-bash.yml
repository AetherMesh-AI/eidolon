        """Execute the frozen canonical one-test command once; retain its actual status."""
        from datetime import datetime, timezone
        import json
        from pathlib import Path
        import subprocess
        import sys

        from evidence_gate import COMMAND, NODE, inspect_shell, load_json


        def main():
            root, raw = (Path(value).resolve() for value in sys.argv[1:3])
            raw.mkdir(parents=True, exist_ok=True)
            command = [part.replace('[EVIDENCE]', raw.as_posix()) for part in COMMAND]
            result = {'schema': 1, 'expectedNode': NODE, 'canonicalScript': 'scripts/run_tests.sh',
                      'normalizedArgv': COMMAND,
                      'fileRetries': 0, 'workers': 1, 'fileTimeoutSeconds': 300,
                      'publicationWaitSeconds': 0.25,
                      'startedAt': datetime.now(timezone.utc).isoformat()}
            observer_healthy = True
            result['exitCode'] = 126
            try:
                handoff = load_json(raw / 'shell-handoff.json')
                result['shellBefore'] = inspect_shell(sys.argv[3])
                assert result['shellBefore'] == handoff
                command[0] = handoff['path']
                result['actualArgv'] = command
                with (raw / 'canonical.log').open('w', encoding='utf-8') as output:
                    completed = subprocess.run(command, cwd=root, stdout=output, stderr=subprocess.STDOUT)
                    # Store the actual result before any observer/file cleanup can fail.
                    result['exitCode'] = completed.returncode
                result['shellAfter'] = inspect_shell(sys.argv[3])
                assert result['shellAfter'] == handoff
            except Exception:
                observer_healthy = False
                if result['exitCode'] == 126:
                    result['launchError'] = True
            result['completedAt'] = datetime.now(timezone.utc).isoformat()
            try:
                (raw / 'run-result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
            except Exception:
                observer_healthy = False  # Missing receipt invalidates evidence, not the test exit.
            try:
                print('Canonical diagnostic exited with status ' + str(result['exitCode']))
            except Exception:
                observer_healthy = False  # Reporting must not replace the canonical subprocess result.
            try:
                (raw / 'launcher-health.json').write_text(json.dumps({'healthy': observer_healthy}) + '\n', encoding='utf-8')
            except Exception:
                pass  # Missing final health receipt also invalidates evidence.
            return result['exitCode']


        if __name__ == '__main__':
            raise SystemExit(main())
