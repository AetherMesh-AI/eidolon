name: Windows owner-policy exact-test diagnostic (not acceptance)
'on':
  push:
    branches:
    - proof/pr208-windows-owner-policy-diagnostic-bash-20261019
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  diagnostic:
    name: One original owner-policy test (diagnostic only)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 8ee62f7356a5274ebd5bbc61c1144d479fb7f369
        fetch-depth: 1
    - name: Verify immutable product checkout
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 8ee62f7356a5274ebd5bbc61c1144d479fb7f369
        test "$(git rev-parse HEAD^{tree})" = 296ccba6612cbff2ec81480c1eaff95668624d2a
        test "$(git write-tree)" = 296ccba6612cbff2ec81480c1eaff95668624d2a
        git diff --quiet --exit-code
        git diff --cached --quiet --exit-code
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install locked Python runtime and test dependencies
      run: |
        python -m pip install uv==0.12.23
        uv sync --locked --python 3.12 --extra dev
        uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
    - name: Prepare passive output capture and closed evidence gate
      id: prepare
      run: |
        set -euo pipefail
        HELPERS="$RUNNER_TEMP/pr208-windows-owner-policy-helpers"
        RAW="$RUNNER_TEMP/pr208-windows-owner-policy-private"
        test ! -e "$RAW"
        test ! -e pr208_owner_policy_capture.py
        mkdir -p "$HELPERS" "$RAW"
        .venv/Scripts/python.exe - <<'PR208_CAPTURE_ABSENCE_CHECK'
        import importlib.util
        from pathlib import Path
        capture = Path('pr208_owner_policy_capture.py')
        bytecode = Path(importlib.util.cache_from_source(str(capture)))
        assert not capture.exists() and not capture.is_symlink()
        assert not bytecode.parent.is_symlink()
        assert not bytecode.exists() and not bytecode.is_symlink()
        PR208_CAPTURE_ABSENCE_CHECK
        cat > "pr208_owner_policy_capture.py" <<'PR208_OWNER_POLICY_HELPER_0'
        """Passive output and exact-selection observer for one temporary CI diagnostic."""
        import json
        from pathlib import Path
        import sys
        import threading

        import pytest

        NODE = 'tests/eidolon_cli/test_organization_owner_policy.py::test_same_key_concurrent_apply_returns_one_receipt_and_one_generation'
        _state = {}
        _errors = []


        def _note_error(exc):
            if len(_errors) < 32:
                _errors.append(type(exc).__name__ if type(exc).__name__ in {'OSError', 'ValueError', 'TypeError', 'AttributeError', 'RuntimeError', 'PermissionError'} else 'ObserverError')


        class Tee:
            def __init__(self, original, sink, lock):
                self.original, self.sink, self.lock = original, sink, lock

            def write(self, value):
                try:
                    with self.lock:
                        self.sink.write(value)
                        self.sink.flush()
                except Exception as exc:
                    _note_error(exc)
                return self.original.write(value)

            def flush(self):
                try:
                    with self.lock:
                        self.sink.flush()
                except Exception as exc:
                    _note_error(exc)
                return self.original.flush()

            def __getattr__(self, name):
                return getattr(self.original, name)


        def pytest_addoption(parser):
            parser.addoption('--pr208-evidence-dir')


        @pytest.hookimpl(trylast=True)
        def pytest_configure(config):
            value = config.getoption('--pr208-evidence-dir')
            if not value or config.option.showlocals:
                raise pytest.UsageError('Missing diagnostic output directory or forbidden local-variable display')
            out = Path(value)
            out.mkdir(parents=True, exist_ok=True)
            sink = (out / 'pytest-full.log').open('w', encoding='utf-8', buffering=1)
            lock = threading.RLock()
            reporter = config.pluginmanager.getplugin('terminalreporter')
            if reporter is None:
                sink.close()
                raise pytest.UsageError('Diagnostic terminal reporter is unavailable')
            _state.update(out=out, sink=sink, stdout=sys.stdout, stderr=sys.stderr,
                          reporter=reporter, terminal_file=reporter._tw._file)
            reporter._tw._file = Tee(reporter._tw._file, sink, lock)
            sys.stdout = Tee(sys.stdout, sink, lock)
            sys.stderr = Tee(sys.stderr, sink, lock)
            _write('configuration.json', {'showlocals': False, 'capture': config.option.capture,
                                          'expectedNode': NODE, 'pytestVersion': pytest.__version__})


        def _write(name, data):
            try:
                (_state['out'] / name).write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
            except Exception as exc:
                _note_error(exc)


        def pytest_collection_finish(session):
            nodes = [item.nodeid for item in session.items]
            _write('selection.json', {'expectedNode': NODE, 'selectedNodes': nodes, 'selectedCount': len(nodes)})
            if nodes != [NODE]:
                pytest.exit('Diagnostic requires exactly the original selected node', returncode=4)


        def pytest_runtest_logreport(report):
            try:
                data = {'nodeid': report.nodeid, 'when': report.when, 'outcome': report.outcome,
                        'duration': report.duration, 'wasxfail': bool(getattr(report, 'wasxfail', False))}
                if report.failed:
                    data['failure'] = report.longreprtext
                with (_state['out'] / 'reports.jsonl').open('a', encoding='utf-8') as out:
                    out.write(json.dumps(data) + '\n')
            except Exception as exc:
                _note_error(exc)


        def pytest_sessionfinish(session, exitstatus):
            try:
                _write('session.json', {'exitstatus': int(exitstatus), 'testscollected': session.testscollected,
                                        'testsfailed': session.testsfailed})
            except Exception as exc:
                _note_error(exc)


        @pytest.hookimpl(trylast=True)
        def pytest_unconfigure(config):
            if not _state:
                return
            for key in ('stdout', 'stderr'):
                try:
                    setattr(sys, key, _state[key])
                except Exception as exc:
                    _note_error(exc)
            try:
                _state['reporter']._tw._file = _state['terminal_file']
            except Exception as exc:
                _note_error(exc)
            try:
                _state['sink'].close()
            except Exception as exc:
                _note_error(exc)
            _write('observer-health.json', {'healthy': not _errors, 'errors': list(_errors)})
            _state.clear()
            _errors.clear()
        PR208_OWNER_POLICY_HELPER_0
        cat > "$HELPERS/evidence_gate.py" <<'PR208_OWNER_POLICY_HELPER_1'
        """Stdlib-only provenance, sanitization and closed diagnostic evidence gate."""
        import argparse
        import ast
        from datetime import datetime, timezone
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path, PureWindowsPath
        import re
        import subprocess
        import sys
        import xml.etree.ElementTree as ET

        COMMIT = '8ee62f7356a5274ebd5bbc61c1144d479fb7f369'
        TREE = '296ccba6612cbff2ec81480c1eaff95668624d2a'
        TEST_FILE = 'tests/eidolon_cli/test_organization_owner_policy.py'
        TEST_NAME = 'test_same_key_concurrent_apply_returns_one_receipt_and_one_generation'
        NODE = TEST_FILE + '::' + TEST_NAME
        CAPTURE = 'pr208_owner_policy_capture.py'
        COMMAND = ['bash', 'scripts/run_tests.sh', TEST_FILE, '-j', '1', '--file-retries', '0',
            '--file-timeout', '300', '--', '-k', TEST_NAME, '-vv', '-s', '--tb=long',
            '-p', 'scripts.ci.organization_timing', '--organization-timing-dir=[EVIDENCE]/timing',
            '-o', 'faulthandler_timeout=30', '-p', 'pr208_owner_policy_capture',
            '--pr208-evidence-dir=[EVIDENCE]', '--junitxml=[EVIDENCE]/junit.xml',
            '-o', 'junit_logging=all', '-o', 'junit_log_passing_tests=true']
        BLOBS = {
            'pyproject.toml': 'dd7ea4a270cb44007799261c08c696954fef20a2',
            'uv.lock': '8630ae1f3ef04e67578ad7c4626526e4dbd534a7',
            TEST_FILE: '567921f8b2f26c2925068a8c414b3a550edf48bf',
            'eidolon_cli/organization_owner_policy.py': '65a2c707eb598d68da7da847e2f81558c3263758',
            'eidolon_cli/organization_ledger_writer.py': 'be979d230ef8e92aa13c06474f7c3696e3601ded',
            'scripts/run_tests.sh': '67e050ce111f13582eaf1d4c1617bf1416aff268',
            'scripts/run_tests_parallel.py': 'b6fc3d63abccdf8b3bcd856321de63fd1ff08b93',
            'scripts/ci/organization_timing.py': '31f49f4828f40d375125e111723ffd07138098a2',
            'scripts/ci/organization_sqlite_diagnostics.py': '48454c646d4e462a34df1f219dae5b7f8a4230b8',
        }
        RAW_NAMES = frozenset(('source-before.json', 'source-after.json', 'configuration.json',
            'selection.json', 'session.json', 'reports.jsonl', 'junit.xml', 'canonical.log',
            'pytest-full.log', 'run-result.json', 'observer-health.json', 'launcher-health.json', 'cleanup.json',
            'shell-handoff.json'))
        CAP = 8 * 1024 * 1024
        ANSI = re.compile(r'\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07]*(?:\x07|\x1b\\))')
        SENSITIVE = re.compile(r'(?i)(?:authorization\s*[:=]|\bbearer\s+\S+|(?:api[_-]?key|access[_-]?token|refresh[_-]?token|password|passwd|client[_-]?secret)\s*[\"\x27]?\s*[:=]|gh[pousr]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|AKIA[A-Z0-9]{16}|-----BEGIN)')


        def write(path, value):
            Path(path).write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')


        def digest(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()


        def git(root, *args):
            return subprocess.check_output(['git', *args], cwd=root, stderr=subprocess.DEVNULL).decode('utf-8').strip()


        def shell_path(value):
            assert isinstance(value, str) and re.match(r'^[A-Za-z]:[/\\]', value)
            assert all(ord(c) >= 32 and ord(c) != 127 for c in value)
            path = PureWindowsPath(value)
            assert path.is_absolute() and path.name.lower() == 'bash.exe' and '..' not in path.parts
            return path.as_posix()


        def inspect_shell(value):
            """Inspect only the enclosing Bash executable handed off by the workflow."""
            assert sys.platform == 'win32'
            normalized = shell_path(value)
            path = Path(normalized)
            assert path.is_file() and not path.is_symlink()
            content = path.read_bytes()
            assert len(content) >= 64 and content[:2] == b'MZ'
            pe_offset = int.from_bytes(content[60:64], 'little')
            assert content[pe_offset:pe_offset + 4] == b'PE\0\0'
            return {'source': 'enclosing-GitHub-Bash', 'path': normalized,
                    'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content),
                    'format': 'PE', 'verified': True}


        def check_source(root, output, expected_capture_sha, run_id, attempt):
            root = Path(root)
            receipt = {'schema': 1, 'expectedCommit': COMMIT, 'expectedTree': TREE,
                       'runId': str(run_id), 'runAttempt': str(attempt),
                       'platform': sys.platform, 'pythonVersion': list(sys.version_info[:3]),
                       'expectedNode': NODE, 'verified': False,
                       'capturedAt': datetime.now(timezone.utc).isoformat()}
            try:
                receipt.update(commit=git(root, 'rev-parse', 'HEAD'), tree=git(root, 'rev-parse', 'HEAD^{tree}'),
                               indexTree=git(root, 'write-tree'))
                assert receipt['commit'] == COMMIT and receipt['tree'] == receipt['indexTree'] == TREE
                subprocess.run(['git', 'diff', '--quiet', '--exit-code'], cwd=root, check=True)
                subprocess.run(['git', 'diff', '--cached', '--quiet', '--exit-code'], cwd=root, check=True)
                assert sys.platform == 'win32' and sys.version_info[:2] == (3, 12)
                actual = {}
                for path, blob in BLOBS.items():
                    actual[path] = {'gitBlob': git(root, 'hash-object', '--path', path, path),
                                    'workingBytesSha256': digest(root / path)}
                    assert actual[path]['gitBlob'] == blob
                receipt['sources'] = actual
                tree = ast.parse((root / TEST_FILE).read_text(encoding='utf-8'))
                matches = [n for n in tree.body if isinstance(n, ast.FunctionDef) and TEST_NAME in n.name]
                assert len(matches) == 1 and matches[0].name == TEST_NAME and not matches[0].decorator_list
                receipt['selectedSourceLine'] = matches[0].lineno
                writer = ast.parse((root / 'eidolon_cli/organization_ledger_writer.py').read_text(encoding='utf-8'))
                values = [ast.literal_eval(n.value) for n in writer.body if isinstance(n, ast.Assign)
                          and any(isinstance(t, ast.Name) and t.id == 'PUBLICATION_WAIT_SECONDS' for t in n.targets)]
                assert values == [0.25]
                receipt['publicationWaitSeconds'] = values[0]
                assert not (root / CAPTURE).is_symlink() and (root / CAPTURE).is_file()
                receipt['captureSha256'] = digest(root / CAPTURE)
                assert receipt['captureSha256'] == expected_capture_sha
                assert git(root, 'ls-files', '--', CAPTURE) == ''
                receipt['verified'] = True
            except Exception as exc:
                receipt['errorCategory'] = type(exc).__name__ if type(exc).__name__ in {
                    'AssertionError', 'CalledProcessError', 'FileNotFoundError', 'PermissionError',
                    'SyntaxError', 'ValueError', 'UnicodeDecodeError'} else 'VerificationError'
            write(output, receipt)
            return receipt['verified']


        def sanitize(text, roots=()):
            text = ANSI.sub('', str(text))
            for root in sorted({str(p) for p in roots if p}, key=len, reverse=True):
                for form in {root, root.replace('\\', '/'), root.replace('/', '\\')}:
                    text = re.sub(re.escape(form), '[PATH]', text, flags=re.I)
            text = re.sub(r'-----BEGIN[^\n]*-----.*?(?:-----END[^\n]*-----|\Z)', '[REDACTED_BLOCK]', text, flags=re.S)
            lines = []
            for line in text.splitlines(keepends=True):
                if SENSITIVE.search(line):
                    lines.append('[REDACTED_SENSITIVE_LINE]' + ('\n' if line.endswith('\n') else ''))
                else:
                    line = re.sub(r'(?i)https?://[^\s<>\"\x27]+', '[URL]', line)
                    line = re.sub(r'(?i)[A-Z]:[/\\][^\s\"\x27<>]+', '[ABSOLUTE_PATH]', line)
                    lines.append(''.join(c for c in line if c in '\n\t' or ord(c) >= 32 and ord(c) != 127))
            return ''.join(lines)


        def cleanup_source(root, output, expected_capture_sha):
            """Remove only this verified helper; receipt is mandatory for valid evidence."""
            root = Path(root)
            capture = root / CAPTURE
            bytecode = Path(importlib.util.cache_from_source(str(capture)))
            receipt = {'schema': 1, 'verified': False, 'captureSha256': expected_capture_sha,
                       'captureAbsent': False, 'bytecodeAbsent': False, 'trackedClean': False}
            try:
                receipt.update(commit=git(root, 'rev-parse', 'HEAD'), tree=git(root, 'rev-parse', 'HEAD^{tree}'),
                               indexTree=git(root, 'write-tree'))
                assert receipt['commit'] == COMMIT and receipt['tree'] == receipt['indexTree'] == TREE
                assert capture.is_file() and not capture.is_symlink()
                assert digest(capture) == expected_capture_sha
                assert git(root, 'ls-files', '--', CAPTURE) == ''
                assert not bytecode.parent.is_symlink() and not bytecode.is_symlink()
                assert not bytecode.exists() or bytecode.is_file()
                subprocess.run(['git', 'diff', '--quiet', '--exit-code'], cwd=root, check=True)
                subprocess.run(['git', 'diff', '--cached', '--quiet', '--exit-code'], cwd=root, check=True)
                if bytecode.exists():
                    bytecode.unlink()
                capture.unlink()
                receipt['captureAbsent'] = not capture.exists() and not capture.is_symlink()
                receipt['bytecodeAbsent'] = not bytecode.exists() and not bytecode.is_symlink()
                assert receipt['captureAbsent'] and receipt['bytecodeAbsent']
                assert git(root, 'rev-parse', 'HEAD') == COMMIT
                assert git(root, 'rev-parse', 'HEAD^{tree}') == git(root, 'write-tree') == TREE
                subprocess.run(['git', 'diff', '--quiet', '--exit-code'], cwd=root, check=True)
                subprocess.run(['git', 'diff', '--cached', '--quiet', '--exit-code'], cwd=root, check=True)
                receipt['trackedClean'] = True
                receipt['verified'] = True
            except Exception as exc:
                receipt['errorCategory'] = type(exc).__name__ if type(exc).__name__ in {
                    'AssertionError', 'CalledProcessError', 'FileNotFoundError', 'PermissionError',
                    'OSError', 'ValueError'} else 'CleanupError'
            write(output, receipt)
            return receipt['verified']


        def sensitive_key(key):
            return bool(re.search(r'(?:password|passwd|secret|apikey|accesstoken|refreshtoken|authorization|cookie)$', re.sub(r'[^a-z0-9]', '', str(key).lower())))


        def sanitize_value(value, roots=()):
            if isinstance(value, str):
                return sanitize(value, roots)
            if isinstance(value, list):
                return [sanitize_value(item, roots) for item in value]
            if isinstance(value, dict):
                return {sanitize(str(key), roots): '[REDACTED_VALUE]' if sensitive_key(key) else sanitize_value(item, roots) for key, item in value.items()}
            return value


        def load_json(path):
            return json.loads(Path(path).read_text(encoding='utf-8'))


        def validate_payload(data, junit, timings, expected_capture_sha):
            """Validate data only; used identically by hosted finishing and local controls."""
            for key in ('source-before.json', 'source-after.json'):
                source = data[key]
                assert source['verified'] is True
                assert source['commit'] == COMMIT and source['tree'] == source['indexTree'] == TREE
                assert source['publicationWaitSeconds'] == 0.25 and source['platform'] == 'win32'
                assert source['pythonVersion'][:2] == [3, 12]
                assert source['expectedNode'] == NODE and source['captureSha256'] == expected_capture_sha
                assert {p: v['gitBlob'] for p, v in source['sources'].items()} == BLOBS
                assert all(isinstance(v.get('workingBytesSha256'), str) and re.fullmatch(r'[0-9a-f]{64}', v['workingBytesSha256']) for v in source['sources'].values())
            before, after = data['source-before.json'], data['source-after.json']
            assert before['sources'] == after['sources']
            assert before['runId'] == after['runId'] and before['runAttempt'] == after['runAttempt']
            assert re.fullmatch(r'[1-9][0-9]*', before['runId']) and before['runAttempt'] == '1'
            cleanup = data['cleanup.json']
            assert cleanup['verified'] is True and cleanup['trackedClean'] is True
            assert cleanup['captureAbsent'] is True and cleanup['bytecodeAbsent'] is True
            assert cleanup['captureSha256'] == expected_capture_sha
            assert cleanup['commit'] == COMMIT and cleanup['tree'] == cleanup['indexTree'] == TREE
            configuration = data['configuration.json']
            assert configuration['showlocals'] is False and configuration['capture'] == 'no'
            assert configuration['expectedNode'] == NODE and configuration['pytestVersion'] == '9.1.1'
            selection = data['selection.json']
            assert selection['expectedNode'] == NODE and selection['selectedCount'] == 1 and selection['selectedNodes'] == [NODE]
            assert data['observer-health.json'] == {'healthy': True, 'errors': []}
            assert data['launcher-health.json'] == {'healthy': True}
            reports = data['reports.jsonl']
            assert len(reports) == 3
            assert [e['when'] for e in reports] == ['setup', 'call', 'teardown']
            assert all(e['nodeid'] == NODE and e['wasxfail'] is False for e in reports)
            assert reports[0]['outcome'] == reports[2]['outcome'] == 'passed'
            assert reports[1]['outcome'] in ('passed', 'failed')
            failed = reports[1]['outcome'] == 'failed'
            if failed:
                assert isinstance(reports[1].get('failure'), str) and reports[1]['failure'].strip()
            assert junit.tag == 'testsuites' and len(junit) == 1 and junit[0].tag == 'testsuite'
            suite = junit[0]
            assert all(child.tag in ('testcase', 'properties') for child in suite)
            cases = list(junit.iter('testcase'))
            assert len(cases) == 1 and cases == list(suite.findall('testcase'))
            case = cases[0]
            assert case.get('name') == TEST_NAME and case.get('classname') == TEST_FILE[:-3].replace('/', '.')
            assert not list(junit.iter('skipped')) and not list(junit.iter('error'))
            failures = list(junit.iter('failure'))
            assert failures == list(case.findall('failure'))
            assert len(failures) == int(failed)
            if failed:
                assert (failures[0].text or '').strip()
            for suite in junit.iter('testsuite'):
                assert int(suite.get('tests', '-1')) == 1 and int(suite.get('skipped', '-1')) == 0
                assert int(suite.get('errors', '-1')) == 0 and int(suite.get('failures', '-1')) == int(failed)
            session = data['session.json']
            assert session['testscollected'] == 1 and session['testsfailed'] == int(failed)
            assert session['exitstatus'] == int(failed)
            result = data['run-result.json']
            assert result['normalizedArgv'] == COMMAND
            handoff = data['shell-handoff.json']
            assert handoff == result['shellBefore'] == result['shellAfter']
            assert set(handoff) == {'source', 'path', 'sha256', 'bytes', 'format', 'verified'}
            assert handoff['source'] == 'enclosing-GitHub-Bash' and handoff['verified'] is True
            assert handoff['format'] == 'PE' and type(handoff['bytes']) is int and handoff['bytes'] >= 64
            assert re.fullmatch(r'[0-9a-f]{64}', handoff['sha256'])
            assert shell_path(handoff['path']) == handoff['path']
            actual = result['actualArgv']
            assert len(actual) == len(COMMAND) and all(isinstance(arg, str) for arg in actual)
            prefix = '--pr208-evidence-dir='
            evidence_argument = actual[COMMAND.index(prefix + '[EVIDENCE]')]
            assert evidence_argument.startswith(prefix)
            evidence_dir = evidence_argument[len(prefix):]
            assert re.match(r'^[A-Za-z]:/', evidence_dir) and '..' not in evidence_dir.split('/')
            assert '\\' not in evidence_dir and all(ord(c) >= 32 and ord(c) != 127 for c in evidence_dir)
            assert actual == [handoff['path']] + [part.replace('[EVIDENCE]', evidence_dir) for part in COMMAND[1:]]
            assert result['exitCode'] == int(failed) and result['fileRetries'] == 0 and result['workers'] == 1
            assert result['fileTimeoutSeconds'] == 300 and result['expectedNode'] == NODE
            assert result['canonicalScript'] == 'scripts/run_tests.sh' and result['publicationWaitSeconds'] == 0.25
            assert len(timings) > 0
            assert [e['nodeid'] for e in timings if e['event'] == 'start'] == [NODE]
            assert all(e.get('nodeid', NODE) == NODE for e in timings)
            for phase, outcome in [('setup', 'passed'), ('call', reports[1]['outcome']), ('teardown', 'passed')]:
                events = [e for e in timings if e['event'] == phase]
                assert len(events) == 1 and events[0]['outcome'] == outcome
            return {'valid': True, 'classification': 'selected-test-failed' if failed else 'isolated-nonreproduction',
                    'expectedNode': NODE, 'testCount': 1, 'unskippedCount': 1,
                    'originalCauseClosed': False, 'canonicalAcceptance': False,
                    'runId': before['runId'], 'runAttempt': before['runAttempt']}


        def regular_bytes(path):
            assert path.is_file() and not path.is_symlink()
            assert path.stat().st_size <= CAP
            return path.read_bytes()


        def finish(raw, out, expected_capture_sha, roots):
            raw, out = Path(raw), Path(out)
            out.mkdir(parents=True, exist_ok=True)
            assert not out.is_symlink() and out.resolve() != raw.resolve()
            assert not list(out.iterdir()), 'Output directory must be fresh'
            proof = {'valid': False, 'classification': 'incomplete-or-invalid-evidence',
