            return proof['valid'] and not export_error


        def main():
            parser = argparse.ArgumentParser()
            sub = parser.add_subparsers(dest='command', required=True)
            source = sub.add_parser('source')
            source.add_argument('root'); source.add_argument('output'); source.add_argument('capture_sha')
            source.add_argument('run_id'); source.add_argument('attempt')
            cleanup = sub.add_parser('cleanup')
            cleanup.add_argument('root'); cleanup.add_argument('output'); cleanup.add_argument('capture_sha')
            shell = sub.add_parser('shell')
            shell.add_argument('executable'); shell.add_argument('output')
            ending = sub.add_parser('finish')
            ending.add_argument('raw'); ending.add_argument('out'); ending.add_argument('capture_sha')
            args = parser.parse_args()
            if args.command == 'source':
                ok = check_source(args.root, args.output, args.capture_sha, args.run_id, args.attempt)
            elif args.command == 'cleanup':
                ok = cleanup_source(args.root, args.output, args.capture_sha)
            elif args.command == 'shell':
