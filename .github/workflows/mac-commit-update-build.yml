name: Mac commit update build
on:
  push:
    branches: ['test/mac-commit-update-20261008']
    paths: ['.github/workflows/mac-commit-update-build.yml', '.github/scripts/mac-commit-update-build.py']
permissions:
  contents: read
jobs:
  native-arm64-build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SOURCE_COMMIT: 53ab5d6b2287b931457335931f91d36ef017dbad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve build driver and select exact approved source
        run: |
          cp .github/scripts/mac-commit-update-build.py "$RUNNER_TEMP/mac-commit-update-build.py"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(uname -m)" = arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          architecture: arm64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install locked workspace dependencies
        run: npm ci --include=dev --include=optional
      - name: Build exact main desktop source
        run: GITHUB_SHA="$SOURCE_COMMIT" npm run build --workspace apps/desktop
      - name: Package and validate user-copyable ARM64 app
        run: python3 "$RUNNER_TEMP/mac-commit-update-build.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Eidolon-mac-arm64-53ab5d6b
          path: ${{ runner.temp }}/mac-commit-build/deliver/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
