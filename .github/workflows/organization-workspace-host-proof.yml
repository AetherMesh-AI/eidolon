name: Temporary organization workspace host proof
on:
  push:
    branches: [temp/organization-workspace-host-proof]
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  organization-workspace:
    name: Organization workspace host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15921e5134e3a1cc3c8a548a8ac5d147a52b808f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12 --extra dev --extra slack
          uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 'https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc'
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "15921e5134e3a1cc3c8a548a8ac5d147a52b808f"
          test "$(git rev-parse HEAD^{tree})" = "4dff808ec71d8344802589af78471d7de5c3eaaf"
          git rev-parse HEAD HEAD^{tree} > organization-workspace-source.txt
      - name: Run new workspace boundary contracts without retry
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 NODE_DISABLE_COMPILE_CACHE=1 HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh -j 1 tests/eidolon_cli/test_organization_workspaces.py tests/tui_gateway/test_organization_workspaces.py -- -q -p no:cacheprovider --tb=short 2>&1 | tee organization-workspace-backend.log
      - name: Retain bounded proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: organization-workspace-host-${{ matrix.os }}
          path: |
            organization-workspace-source.txt
            organization-workspace-backend.log
          retention-days: 7
