        #!/usr/bin/env python3
        """Sanitize bounded npm evidence after one install; never run npm itself."""
        from __future__ import annotations

        import argparse
        import json
        from pathlib import Path
        import subprocess
        import sys

        MAX_DEBUG_FILES = 16
        MAX_LOG_BYTES = 1_048_576


        def collect(observer: Path, output: Path, console: Path, debug: Path, status: int) -> dict:
            output.mkdir(parents=True, exist_ok=True)
            results = []
            collection_failed = False
            debug_list_failed = False
            try:
                files = sorted(p for p in debug.glob('*-debug-0.log') if p.is_file())
            except OSError:
                files = []
                debug_list_failed = True
            selected = files[-MAX_DEBUG_FILES:]
            sources = [('console.log', console)] + [
                (f'npm-debug-{i:02d}.log', p) for i, p in enumerate(selected)
            ]
            for name, source in sources:
                try:
                    completed = subprocess.run(
                        [sys.executable, str(observer), 'sanitize', '--input', str(source),
                         '--output', str(output / name), '--max-bytes', str(MAX_LOG_BYTES)],
                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False,
                    )
                    code = completed.returncode
                except OSError:
                    code = None
                failed = code != 0
                collection_failed |= failed
                results.append({'name': name, 'sanitizeExitCode': code, 'failed': failed})
            receipt = {
                'version': 1,
                'npmCommand': ['npm', 'ci'],
                'npmExitCode': status,
                'installRuns': 1,
                'debugFilesObserved': len(files),
                'debugFilesSelected': len(selected),
                'debugSelectionTruncated': len(files) > MAX_DEBUG_FILES,
                'debugListingFailed': debug_list_failed,
                'collectionFailed': collection_failed or debug_list_failed,
                'maxLogBytes': MAX_LOG_BYTES,
                'logs': results,
            }
            (output / 'install-result.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
            return receipt


        def main() -> int:
            parser = argparse.ArgumentParser()
            for name in ('observer', 'output', 'console', 'debug'):
                parser.add_argument('--' + name, type=Path, required=True)
            parser.add_argument('--status', type=int, required=True)
            args = parser.parse_args()
            receipt = collect(args.observer, args.output, args.console, args.debug, args.status)
            print(json.dumps({'collectionFailed': receipt['collectionFailed'],
                              'debugSelectionTruncated': receipt['debugSelectionTruncated']}))
            return 1 if receipt['collectionFailed'] else 0


        if __name__ == '__main__':
            raise SystemExit(main())
