name: Organization history verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-org-history.yml'
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install declared runtime and pinned test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 ruff==0.15.10
      - name: Verify Linux organization suites
        if: runner.os == 'Linux'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py tests/tools/test_organization_file_read.py -j 4
          .venv/bin/ruff check eidolon_cli/organization_history.py eidolon_cli/organization_snapshot.py eidolon_cli/organization_store.py eidolon_cli/organization_service.py tui_gateway/methods_organization.py tests/eidolon_cli/test_organization_history.py tests/tui_gateway/test_organization_history.py tests/tui_gateway/test_organization.py
          .venv/bin/python scripts/check_compat_pointers.py
      - name: Verify native macOS history and execution fences
        if: runner.os == 'macOS'
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization_history.py tests/tui_gateway/test_organization_history.py tests/eidolon_cli/test_organization_coordination.py tests/eidolon_cli/test_organization_resolution_service.py -j 3
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked desktop dependencies
        run: npm ci --ignore-scripts
      - name: Verify organization UI and types
        working-directory: apps/desktop
        run: |
          npx vitest run src/app/eidolon
          npm run typecheck
          npx eslint src/app/eidolon/runtime-history.tsx src/app/eidolon/runtime-history-types.ts src/app/eidolon/runtime-history.test.tsx src/app/eidolon/runtime-adapter.ts src/app/eidolon/runtime-detail.tsx src/app/eidolon/types.ts src/app/eidolon/workspace.tsx src/i18n/organization-work.ts
