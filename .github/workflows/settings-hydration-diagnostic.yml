name: Settings hydration diagnostics
on:
  push:
    branches: [diagnostic/settings-hydration-168]
permissions:
  contents: read
env:
  CI: 'true'
  HERMES_TEST_FILE_RETRIES: '0'
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''
jobs:
  settings-diagnostic:
    name: Workspace gallery (${{ matrix.group }}, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
        - settings
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install locked Python runtime and test dependencies
      run: 'python -m pip install uv==0.12.23
  
        uv sync --locked --python 3.12 --extra dev
  
        uv pip install --no-deps pytest-timeout==2.4.0 exceptiongroup==1.3.0 ''https://files.pythonhosted.org/packages/6e/c2/61d3e0f47e2b74ef40a68b9e6ad5984f6241a942f7cd3bbfbdbd03861ea9/tomli-2.2.1-py3-none-any.whl#sha256=cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc''
  
        '
    - name: Install locked desktop dependencies
      run: npm ci
    - name: Install required native project isolation
      run: bash scripts/ci/organization-sandbox.sh
    - name: Install Electron system dependencies
      run: 'sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6
        xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2 fonts-noto-cjk
  
        fc-match --format=''%{family}\n'' '':lang=ja''
  
        '
    - name: Build desktop
      working-directory: apps/desktop
      run: npm run build
    - name: Verify page composition, zoom and keyboard access
      working-directory: apps/desktop
      env:
        EIDOLON_REQUIRE_PROJECT_SANDBOX: '1'
        GALLERY_GROUP: ${{ matrix.group }}
      run: xvfb-run -a npx playwright test "e2e/workspace-${GALLERY_GROUP}-gallery.spec.ts"
        --workers=1 --retries=0
    - name: Retain workspace gallery evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: workspace-gallery-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: 'apps/desktop/test-results/
  
          apps/desktop/playwright-report/
  
          '
        retention-days: 7
        if-no-files-found: warn
