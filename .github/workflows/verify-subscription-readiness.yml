name: Subscription readiness verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-subscription-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install declared runtime and pinned test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 ruff==0.15.10
      - name: Verify exact checkout and boundaries
        run: |
          git rev-parse HEAD HEAD^{tree}
          scripts/run_tests.sh tests/eidolon_cli/test_organization_subscription.py tests/eidolon_cli/test_organization_executor.py tests/eidolon_cli/test_organization_transport_budget.py tests/eidolon_cli/test_organization_trial_policy.py
          .venv/bin/ruff check eidolon_cli/organization_subscription.py eidolon_cli/organization_executor.py tests/eidolon_cli/test_organization_subscription.py
          .venv/bin/python -m eidolon_cli.organization_subscription
          .venv/bin/python scripts/check_compat_pointers.py
