name: Organization completion probe
on:
  push:
    branches: [probe/org-completion-20261007]
permissions:
  contents: read
concurrency:
  group: organization-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-completion:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.28'
      - name: Install declared test dependencies
        run: uv sync --locked --python 3.11 --extra dev
      - name: Install sandbox runtime
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap libseccomp2
      - name: Organization contract and recovery suite
        run: scripts/run_tests.sh tests/eidolon_cli/test_organization*.py tests/tui_gateway/test_organization*.py -j 4
      - name: Real nonbillable project completion
        run: .venv/bin/python scripts/eval_organization_project.py --report organization-project-report.json
      - name: Retain exact completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-completion-evidence
          path: organization-project-report.json
          if-no-files-found: warn
